<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Calendar — Amansala</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --teal:#2d6a6a;--teal-l:#3d8080;--dark:#1a2332;
      --sb:#1e2a3a;--sb-hov:#2d3f52;
      --text:#2c3e50;--muted:#7f8c9a;--border:#e0d8cc;--sand:#f7f4ef;
      --label-w:180px;--day-w:36px;--row-h:44px;
    }
    body{font-family:'Jost',sans-serif;background:#f0ece4;color:var(--text);display:flex;min-height:100vh;overflow:hidden;}

    /* Sidebar */
    .sidebar{width:220px;min-width:220px;background:var(--sb);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
    .sb-logo{padding:28px 24px 20px;border-bottom:1px solid rgba(255,255,255,.08);}
    .sb-logo .brand{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:#fff;}
    .sb-logo .sub{font-size:11px;color:rgba(255,255,255,.4);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px;}
    .sb-nav{flex:1;padding:16px 0;}
    .nav-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.3);padding:12px 24px 6px;}
    .sb-nav a{display:flex;align-items:center;gap:10px;padding:10px 24px;color:rgba(255,255,255,.65);text-decoration:none;font-size:13.5px;border-left:3px solid transparent;transition:all .15s;}
    .sb-nav a:hover{background:var(--sb-hov);color:#fff;}
    .sb-nav a.active{background:rgba(45,106,106,.25);color:#fff;border-left-color:var(--teal-l);}
    .sb-nav svg{width:16px;height:16px;flex-shrink:0;opacity:.8;}
    .sb-user{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;}
    .sb-av{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;}
    .sb-uname{font-size:13px;color:#fff;font-weight:500;}
    .sb-urole{font-size:11px;color:rgba(255,255,255,.4);}

    /* Main */
    .main{flex:1;display:flex;flex-direction:column;overflow:hidden;}

    /* Topbar */
    .topbar{background:#fff;border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:12px;flex-wrap:wrap;}
    .topbar h1{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:var(--dark);white-space:nowrap;}
    .topbar-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

    .date-range-lbl{font-size:13.5px;font-weight:600;color:var(--dark);background:var(--sand);border:1px solid var(--border);border-radius:8px;padding:7px 14px;white-space:nowrap;}
    .date-input{padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:'Jost',sans-serif;font-size:13px;color:var(--text);outline:none;}
    .date-input:focus{border-color:var(--teal);}
    .show-sel{padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:'Jost',sans-serif;font-size:13px;color:var(--text);outline:none;background:#fff;cursor:pointer;}
    .show-sel:focus{border-color:var(--teal);}

    .btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;font-family:'Jost',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;border:none;white-space:nowrap;}
    .btn-primary{background:var(--teal);color:#fff;}
    .btn-primary:hover{background:#235555;}
    .btn-secondary{background:#fff;color:var(--text);border:1px solid var(--border);}
    .btn-secondary:hover{background:var(--sand);}
    .btn-nav{background:#fff;color:var(--text);border:1px solid var(--border);padding:7px 12px;border-radius:8px;font-size:13px;cursor:pointer;font-family:'Jost',sans-serif;transition:all .15s;}
    .btn-nav:hover{background:var(--sand);}

    /* Avail bar */
    .avail-bar{background:#fff;border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:6px;flex-shrink:0;font-size:12.5px;color:var(--muted);overflow:hidden;}
    .avail-bar strong{color:var(--dark);}
    .avail-note{margin-left:auto;font-size:11.5px;}

    /* Gantt */
    .gantt-wrap{flex:1;overflow:auto;position:relative;}
    .gantt-inner{position:relative;min-width:max-content;}

    /* Header */
    .gantt-header{position:sticky;top:0;z-index:60;background:#fff;border-bottom:2px solid var(--border);}
    .hrow{display:flex;}
    .corner{width:var(--label-w);min-width:var(--label-w);flex-shrink:0;position:sticky;left:0;z-index:70;background:#fff;border-right:2px solid var(--border);}
    .month-cells{display:flex;}
    .month-cell{display:flex;align-items:center;justify-content:center;border-right:1px solid var(--border);font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--dark);height:36px;background:var(--sand);}
    .day-cells{display:flex;}
    .day-cell{width:var(--day-w);min-width:var(--day-w);height:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9.5px;color:var(--muted);border-right:1px solid #ece7df;user-select:none;}
    .day-cell .dn{font-size:8px;color:#bbb;}
    .day-cell.today{background:rgba(45,106,106,.1);}
    .day-cell.today .dd{color:var(--teal);font-weight:700;}
    .day-cell.weekend{background:#fafaf8;}

    /* Room type header */
    .rt-header-row{display:flex;height:34px;background:#f0ece4;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;}
    .rt-header-row:hover{background:#e8e3da;}
    .rt-label-header{width:var(--label-w);min-width:var(--label-w);flex-shrink:0;position:sticky;left:0;z-index:20;background:#e8e3da;border-right:2px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:6px;}
    .rt-label-header.collapsed{background:#ddd8cf;}
    .rt-collapse-icon{font-size:11px;color:var(--muted);flex-shrink:0;transition:transform .15s;}
    .rt-label-header span{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--dark);}
    .rt-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
    .rt-header-track{flex:1;display:flex;align-items:center;padding:0 12px;font-size:11px;color:var(--muted);}

    /* Room row */
    .room-row{display:flex;height:var(--row-h);border-bottom:1px solid #ece7df;position:relative;}
    .room-row:hover .room-lbl{background:#f7f4ef;}
    .room-lbl{width:var(--label-w);min-width:var(--label-w);flex-shrink:0;position:sticky;left:0;z-index:20;background:#fff;border-right:2px solid var(--border);display:flex;align-items:center;padding:0 10px 0 16px;justify-content:space-between;}
    .room-lbl-name{font-size:12.5px;font-weight:600;color:var(--dark);}
    .room-lbl-vacant{font-size:10.5px;color:#bbb;}
    .room-track{flex:1;position:relative;overflow:visible;}
    .gl{position:absolute;top:0;bottom:0;width:1px;background:#ece7df;pointer-events:none;}
    .gl.ms{background:#d5cfc5;width:2px;}
    .gl.today-line{background:rgba(45,106,106,.5);width:2px;z-index:5;}
    .gl.wk{background:#f4f0eb;width:var(--day-w);}

    /* Booking blocks */
    .bk-block{position:absolute;top:5px;height:34px;border-radius:5px;border:2px solid;padding:0 8px;display:flex;align-items:center;cursor:pointer;overflow:hidden;z-index:10;white-space:nowrap;transition:opacity .15s,box-shadow .15s;}
    .bk-block:hover{opacity:.88;box-shadow:0 3px 8px rgba(0,0,0,.18);z-index:15;}
    .bk-block.dashed{border-style:dashed;}
    .bk-name{font-size:11px;font-weight:600;}
    .bk-sub{font-size:10px;opacity:.7;margin-left:5px;}

    /* Avail row (sticky bottom) */
    .avail-row{display:flex;height:30px;background:var(--sand);border-top:2px solid var(--border);position:sticky;bottom:0;z-index:40;}
    .avail-row-lbl{width:var(--label-w);min-width:var(--label-w);flex-shrink:0;position:sticky;left:0;z-index:50;background:#ede9e1;border-right:2px solid var(--border);display:flex;align-items:center;padding:0 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
    .avail-cells{display:flex;}
    .avail-cell{width:var(--day-w);min-width:var(--day-w);height:30px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--muted);border-right:1px solid #ece7df;}
    .av-full{background:rgba(254,226,226,.5);color:#dc2626;}
    .av-high{background:rgba(254,243,199,.5);color:#92400e;}
    .av-med{background:rgba(209,250,229,.5);color:#065f46;}
    .av-low{background:rgba(167,243,208,.5);color:#065f46;}

    /* Tooltip */
    .tip{position:fixed;background:#1a2332;color:#fff;padding:10px 14px;border-radius:8px;font-size:12.5px;line-height:1.6;pointer-events:none;z-index:400;opacity:0;transition:opacity .15s;max-width:260px;}
    .tip.show{opacity:1;}
    .tip-name{font-weight:700;font-size:13px;}
    .tip-dates{color:rgba(255,255,255,.65);font-size:11.5px;}

    /* Toast */
    .toast{position:fixed;bottom:28px;right:28px;background:#1a2332;color:#fff;padding:11px 20px;border-radius:10px;font-size:13.5px;z-index:500;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;pointer-events:none;}
    .toast.show{opacity:1;transform:translateY(0);}

    /* Scrollbar */
    .gantt-wrap::-webkit-scrollbar{width:8px;height:8px;}
    .gantt-wrap::-webkit-scrollbar-track{background:#f0ece4;}
    .gantt-wrap::-webkit-scrollbar-thumb{background:#c5bfb5;border-radius:4px;}
    .gantt-wrap::-webkit-scrollbar-thumb:hover{background:#a09890;}
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="sb-logo">
    <div class="brand">Amansala</div>
    <div class="sub">Retreat Portal</div>
  </div>
  <nav class="sb-nav">
    <div class="nav-lbl">Navigation</div>
    <a href='/retreat-portal'>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Leader Form
    </a>
    <a href='/retreat-admin'>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Submissions
    </a>
    <a href='/venue-bookings'>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Venue Bookings
    </a>
    <a href='/room-registrations'>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Room Registrations
    </a>
    <a class='active' href='/room-calendar'>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="14" x2="8" y2="18"/><line x1="12" y1="14" x2="12" y2="18"/><line x1="16" y1="14" x2="16" y2="18"/></svg>
      Room Calendar
    </a>
  </nav>
  <div class="sb-user">
    <div class="sb-av">A</div>
    <div><div class="sb-uname">Admin</div><div class="sb-urole">Amansala Staff</div></div>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <h1>Room Calendar</h1>
    <div class="topbar-controls">
      <span class="date-range-lbl" id="dateRangeLbl"></span>
      <label style="font-size:12px;color:var(--muted)">Start:</label>
      <input type="date" class="date-input" id="startInput" onchange="onStartChange()">
      <select class="show-sel" id="showSel" onchange="onShowChange()">
        <option value="14">14 days</option>
        <option value="30" selected>30 days</option>
        <option value="60">60 days</option>
        <option value="90">90 days</option>
      </select>
      <button class="btn-nav" onclick="shiftDays(-showDays)">&lsaquo; Prev</button>
      <button class="btn-nav" onclick="goToday()">Today</button>
      <button class="btn-nav" onclick="shiftDays(showDays)">Next &rsaquo;</button>
    </div>
  </div>

  <div class="avail-bar" id="availBar">
    <span>Loading...</span>
  </div>

  <div class="gantt-wrap" id="ganttWrap">
    <div class="gantt-inner" id="ganttInner"></div>
  </div>
</div>

<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<script>
// ---- Constants ----
const RT_VERSION = '3';
const STATUS = {
  contract_sent:{ label:'Contract Sent',   bg:'#fef3c7', border:'#fcd34d', text:'#92400e', dash:true  },
  deposit:      { label:'Deposit Received',bg:'#ffedd5', border:'#fb923c', text:'#9a3412', dash:false },
  signed:       { label:'Signed',          bg:'#d1fae5', border:'#34d399', text:'#065f46', dash:false },
  confirmed:    { label:'Confirmed',       bg:'#a7f3d0', border:'#10b981', text:'#064e3b', dash:false },
  cancelled:    { label:'Cancelled',       bg:'#fee2e2', border:'#f87171', text:'#991b1b', dash:true  },
};
const DEF_ROOM_TYPES = [
  { id:'rt1', name:'Beachfront King',  color:'#0891b2', maxOcc:2, price1:575, price2:360,
    rooms:['20','21','22','23','24','25','29','30','33','3A','3B','CH1','CH2','CH3'] },
  { id:'rt2', name:'Superior King',    color:'#7c3aed', maxOcc:2, price1:475, price2:305,
    rooms:['1B','13b','34','35','36','Ch0','Ch7','Ch9','Ch19'] },
  { id:'rt3', name:'Garden Plus King', color:'#16a34a', maxOcc:2, price1:390, price2:260,
    rooms:['9n','10n','17','Ch5','Ch8','Ch10','Ch13','Ch22','GV19','GV20'] },
  { id:'rt4', name:'Garden King',      color:'#2d6a6a', maxOcc:2, price1:345, price2:240,
    rooms:['5B','16','Ch6','Ch9-B','Ch12B','Ch18','Ch21','Ch23','GV1','GV2','GV3','GV4','GV5','GV6','GV14','GV15','GV16','GV17','GV18','GV21','GV22'] },
  { id:'rt5', name:'Garden Basic',     color:'#ca8a04', maxOcc:1, price1:295, price2:295,
    rooms:['15','GV7','GV8','GV9','GV10','GV11','GV12','GV23','CH12','CH17'] },
  { id:'rt6', name:'Double Beachview', color:'#2563eb', maxOcc:2, price1:335, price2:335,
    rooms:['2A','4A','4B','12','19A','19B','26','27','28','31','Ch4'] },
  { id:'rt7', name:'Double Room',      color:'#dc2626', maxOcc:2, price1:275, price2:275,
    rooms:['1A','5','13','18','CH0-2','Ch11','Ch14','Ch15','Ch16','Ch20','Ch24','GV13'] },
  { id:'rt8', name:'Triple',           color:'#9333ea', maxOcc:3, price1:230, price2:230,
    rooms:['6','11','14b','32','Ch25','Ch26'] },
  { id:'rt9', name:'Quad',             color:'#e11d48', maxOcc:4, price1:175, price2:175,
    rooms:['14'] },
];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DSHORT = ['Su','Mo','Tu','We','Th','Fr','Sa'];
const DAY_MS = 86400000;

// ---- State ----
let bookings  = [];
let roomTypes = [];
let regs      = [];
let startDate = new Date(2026, 4, 1); // May 1, 2026
let showDays  = 30;
let collapsed = {}; // rtId → bool

// ---- Storage ----
function loadData(){
  bookings  = JSON.parse(localStorage.getItem('amansala_venue_bookings')||'[]');
  const ver = localStorage.getItem('amansala_rt_version');
  roomTypes = (ver===RT_VERSION)
    ? (JSON.parse(localStorage.getItem('amansala_room_types')||'null')||DEF_ROOM_TYPES.map(r=>({...r})))
    : DEF_ROOM_TYPES.map(r=>({...r}));
  regs = JSON.parse(localStorage.getItem('amansala_regs')||'[]');
  const saved = localStorage.getItem('amansala_cal_start');
  if(saved) startDate = new Date(saved+'T00:00:00');
  const savedShow = localStorage.getItem('amansala_cal_show');
  if(savedShow) showDays = parseInt(savedShow);
}
function savePrefs(){
  localStorage.setItem('amansala_cal_start', fmtISO(startDate));
  localStorage.setItem('amansala_cal_show',  String(showDays));
}

// ---- Date helpers ----
function fmtISO(d){ return d.toISOString().split('T')[0]; }
function addDays(d, n){ return new Date(d.getTime() + n*DAY_MS); }
function pd(s){ return new Date(s+'T00:00:00'); }
function fmtDate(s){ if(!s) return ''; return pd(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function fmtShort(d){ return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }

// Build array of Date objects for the window
function buildWindow(){
  const days=[];
  for(let i=0;i<showDays;i++) days.push(addDays(startDate,i));
  return days;
}

// ---- Room booking lookup ----
// Returns list of {startDate, endDate, leaderName, retreatName, status, regId, bookingId} for a room
function getBookingsForRoom(roomName){
  const result=[];
  regs.filter(r=>r.room===roomName).forEach(reg=>{
    const bk=bookings.find(b=>b.id===reg.bookingId);
    if(!bk) return;
    result.push({
      startDate: bk.startDate,
      endDate:   bk.endDate,
      leaderName: bk.leaderName||bk.retreatName,
      retreatName: bk.retreatName,
      status: bk.status||'confirmed',
      regId: reg.id,
      bookingId: bk.id,
      guests: (reg.guests||[]).filter(g=>g.name).map(g=>g.name),
    });
  });
  return result;
}

// ---- Build calendar ----
function build(){
  const days   = buildWindow();
  const endDate = addDays(startDate, showDays-1);
  const todayStr = new Date().toISOString().split('T')[0];
  const inner  = document.getElementById('ganttInner');
  inner.innerHTML = '';

  // Update controls
  document.getElementById('dateRangeLbl').textContent =
    `${fmtShort(startDate)} — ${fmtShort(endDate)}`;
  document.getElementById('startInput').value = fmtISO(startDate);
  document.getElementById('showSel').value = String(showDays);

  // Build month spans for header
  const monthSpans=[];
  let curM=-1, span=null;
  days.forEach((d,i)=>{
    const m=d.getMonth(), y=d.getFullYear();
    if(m!==curM||y!==span?.year){
      span={month:m,year:y,start:i,count:1};
      monthSpans.push(span); curM=m;
    } else { span.count++; }
  });

  // ---- HEADER ----
  const hdr = document.createElement('div');
  hdr.className='gantt-header';

  // Month row
  const mr=document.createElement('div'); mr.className='hrow';
  const c1=document.createElement('div'); c1.className='corner'; c1.style.height='36px'; mr.appendChild(c1);
  const mc=document.createElement('div'); mc.className='month-cells';
  monthSpans.forEach(sp=>{
    const w=sp.count*36;
    const el=document.createElement('div');
    el.className='month-cell';
    el.style.cssText=`width:${w}px;min-width:${w}px`;
    el.textContent=`${MONTHS[sp.month]} ${sp.year}`;
    mc.appendChild(el);
  });
  mr.appendChild(mc); hdr.appendChild(mr);

  // Day row
  const dr=document.createElement('div'); dr.className='hrow';
  const c2=document.createElement('div'); c2.className='corner'; c2.style.height='36px'; dr.appendChild(c2);
  const dc=document.createElement('div'); dc.className='day-cells';
  days.forEach(d=>{
    const ds=fmtISO(d);
    const dow=d.getDay();
    const el=document.createElement('div');
    el.className='day-cell'+(ds===todayStr?' today':'')+(dow===0||dow===6?' weekend':'');
    el.innerHTML=`<span class="dd">${d.getDate()}</span><span class="dn">${DSHORT[dow]}</span>`;
    dc.appendChild(el);
  });
  dr.appendChild(dc); hdr.appendChild(dr);
  inner.appendChild(hdr);

  // ---- ROOM ROWS ----
  const W = showDays*36;
  let totalRooms=0, occupied=new Array(showDays).fill(0), totalRoomCount=0;
  const startMs = startDate.getTime();

  roomTypes.forEach(rt=>{
    totalRooms += rt.rooms.length;

    // Type header
    const th=document.createElement('div');
    th.className='rt-header-row';
    th.addEventListener('click', ()=>{
      collapsed[rt.id]=!collapsed[rt.id];
      th.querySelector('.rt-collapse-icon').textContent = collapsed[rt.id]?'▶':'▼';
      th.querySelector('.rt-label-header').classList.toggle('collapsed', collapsed[rt.id]);
      const rows=document.querySelectorAll(`.rrow-${rt.id}`);
      rows.forEach(r=>r.style.display=collapsed[rt.id]?'none':'flex');
    });

    const rtLblOcc = rt.rooms.filter(rm=>getBookingsForRoom(rm).some(bk=>{
      const s=pd(bk.startDate).getTime(), e=pd(bk.endDate).getTime();
      return s<=startDate.getTime()+showDays*DAY_MS && e>=startDate.getTime();
    })).length;

    th.innerHTML=`
      <div class="rt-label-header">
        <span class="rt-collapse-icon">▼</span>
        <div class="rt-dot" style="background:${rt.color}"></div>
        <span>${rt.name}</span>
      </div>
      <div class="rt-header-track">
        <span style="color:${rt.color};font-weight:600">${rtLblOcc} occupied</span>
        <span style="margin-left:8px">/ ${rt.rooms.length} rooms · ${rt.maxOcc===1?'Private only':`up to ${rt.maxOcc} guests`}</span>
        <span style="margin-left:auto;font-weight:600;color:var(--dark)">${rt.maxOcc===1?'$'+rt.price1:'Solo $'+rt.price1+' · Sharing $'+rt.price2}/night</span>
      </div>`;
    inner.appendChild(th);

    // Room rows
    rt.rooms.forEach(room=>{
      const rr=document.createElement('div');
      rr.className=`room-row rrow-${rt.id}`;

      const lbl=document.createElement('div'); lbl.className='room-lbl';
      lbl.innerHTML=`<span class="room-lbl-name">${room}</span>`;
      rr.appendChild(lbl);

      const track=document.createElement('div');
      track.className='room-track';
      track.style.cssText=`width:${W}px;min-width:${W}px`;

      // Grid lines
      days.forEach((d,i)=>{
        if(d.getDate()===1){
          const gl=document.createElement('div'); gl.className='gl ms'; gl.style.left=`${i*36}px`; track.appendChild(gl);
        }
        if(fmtISO(d)===todayStr){
          const tl=document.createElement('div'); tl.className='gl today-line'; tl.style.left=`${i*36+18}px`; track.appendChild(tl);
        }
        const dow=d.getDay();
        if(dow===0||dow===6){
          const wl=document.createElement('div'); wl.className='gl wk'; wl.style.left=`${i*36}px`; track.appendChild(wl);
        }
      });

      // Booking blocks
      const roomBks = getBookingsForRoom(room);
      roomBks.forEach(bk=>{
        if(bk.status==='cancelled') return;
        const bkStart=pd(bk.startDate).getTime();
        const bkEnd  =pd(bk.endDate).getTime();
        const winEnd = startMs + showDays*DAY_MS;
        if(bkStart>=winEnd||bkEnd<=startMs) return;

        const cs=Math.max(bkStart,startMs);
        const ce=Math.min(bkEnd,winEnd);
        const li=Math.round((cs-startMs)/DAY_MS);
        const wi=Math.round((ce-cs)/DAY_MS);
        if(wi<=0) return;

        const st=STATUS[bk.status]||STATUS.confirmed;
        const bl=document.createElement('div');
        bl.className='bk-block'+(st.dash?' dashed':'');
        bl.style.cssText=`left:${li*36+2}px;width:${wi*36-4}px;background:${st.bg};border-color:${st.border};color:${st.text};`;
        bl.innerHTML=`<span class="bk-name">${bk.leaderName}</span>`
          +(bk.guests&&bk.guests.length?`<span class="bk-sub">${bk.guests[0]}${bk.guests.length>1?` +${bk.guests.length-1}`:''}
</span>`:'');
        bl.addEventListener('mouseenter',e=>showTip(e,bk));
        bl.addEventListener('mousemove',moveTip);
        bl.addEventListener('mouseleave',hideTip);
        bl.addEventListener('click',()=>window.location='room-registrations.html');
        track.appendChild(bl);

        // Count occupancy
        for(let i=Math.max(0,li);i<Math.min(showDays,li+wi);i++) occupied[i]++;
      });

      rr.appendChild(track);
      inner.appendChild(rr);
      totalRoomCount++;
    });
  });

  // ---- AVAILABILITY ROW ----
  const ar=document.createElement('div'); ar.className='avail-row';
  const al=document.createElement('div'); al.className='avail-row-lbl'; al.textContent='Avail'; ar.appendChild(al);
  const ac=document.createElement('div'); ac.className='avail-cells';
  let totalAvail=0;
  days.forEach((_,i)=>{
    const occ=occupied[i];
    const avail=totalRooms-occ;
    totalAvail+=avail;
    const cl=avail===0?'av-full':avail<=totalRooms*.25?'av-high':avail<=totalRooms*.6?'av-med':'av-low';
    const cell=document.createElement('div');
    cell.className=`avail-cell ${cl}`;
    cell.textContent=avail;
    ac.appendChild(cell);
  });
  ar.appendChild(ac); inner.appendChild(ar);

  // Avail bar summary
  document.getElementById('availBar').innerHTML=
    `<strong>${totalRooms}</strong>&nbsp;total rooms &nbsp;·&nbsp; Showing <strong>${showDays}</strong> days &nbsp;·&nbsp; `
    +`Avg availability: <strong>${Math.round(totalAvail/showDays)}</strong> rooms/day`
    +`<span class="avail-note">Colours: <span style="color:#dc2626">■</span> Full &nbsp;<span style="color:#92400e">■</span> High &nbsp;<span style="color:#059669">■</span> Available</span>`;
}

// ---- Navigation ----
function shiftDays(n){
  startDate = addDays(startDate, n);
  savePrefs(); build();
}
function goToday(){
  startDate = new Date();
  startDate.setHours(0,0,0,0);
  savePrefs(); build();
}
function onStartChange(){
  const v=document.getElementById('startInput').value;
  if(v) startDate=pd(v);
  savePrefs(); build();
}
function onShowChange(){
  showDays=parseInt(document.getElementById('showSel').value);
  savePrefs(); build();
}

// ---- Tooltip ----
const tip=document.getElementById('tip');
function showTip(e,bk){
  const st=STATUS[bk.status]||STATUS.confirmed;
  const guests=bk.guests&&bk.guests.length?`<div class="tip-dates">${bk.guests.join(', ')}</div>`:'';
  tip.innerHTML=`<div class="tip-name">${bk.leaderName}${bk.retreatName&&bk.retreatName!==bk.leaderName?` — ${bk.retreatName}`:''}</div>`
    +`<div class="tip-dates">${fmtDate(bk.startDate)} → ${fmtDate(bk.endDate)}</div>`
    +guests
    +`<div style="font-size:11px;font-weight:600;color:${st.border};margin-top:4px">${st.label}</div>`;
  tip.classList.add('show'); moveTip(e);
}
function moveTip(e){
  let x=e.clientX+14,y=e.clientY-10;
  if(x+280>window.innerWidth) x=e.clientX-280;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
function hideTip(){ tip.classList.remove('show'); }

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// ---- Init ----
loadData();
build();
</script>
</body>
</html>
