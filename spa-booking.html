<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#faf7f0;color:#2d2520;min-height:100vh}
.header{background:#3AB7AE;padding:20px;text-align:center}
.header-logo{height:36px}
.header-sub{color:rgba(255,255,255,.7);font-size:12.5px;margin-top:3px;letter-spacing:.3px}
.wrap{max-width:520px;margin:0 auto;padding:26px 16px 70px}
.step-dots{display:flex;justify-content:center;gap:6px;margin-bottom:22px}
.step-dot{width:7px;height:7px;border-radius:50%;background:#e0d5c4}
.step-dot.on{background:#3AB7AE}
.card{background:#fff;border-radius:14px;border:1px solid #e8dfd4;padding:22px 20px;margin-bottom:14px}
.section-title{font-size:19px;font-weight:600;font-family:'Italiana',serif;color:#2d2520;margin-bottom:4px}
.section-sub{font-size:13px;color:#8a7e74;margin-bottom:16px;line-height:1.5}
.svc-card{background:#fff;border-radius:12px;border:1.5px solid #e8dfd4;padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.svc-card:hover{border-color:#3AB7AE;box-shadow:0 2px 8px rgba(45,106,106,.1)}
.svc-name{font-size:15px;font-weight:600;color:#2d2520}
.svc-desc{font-size:12px;color:#8a7e74;margin-top:2px}
.svc-meta{display:flex;gap:10px;margin-top:6px;font-size:12px;color:#4a4038}
.svc-price{font-weight:700;color:#a05a35}
.cat-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#a89a86;margin:18px 0 8px}
.cat-label:first-child{margin-top:0}
.choice-btn{width:100%;text-align:left;background:#fff;border:1.5px solid #e8dfd4;border-radius:12px;padding:14px 16px;margin-bottom:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;color:#2d2520;transition:border-color .15s,background .15s}
.choice-btn:hover{border-color:#3AB7AE;background:#f0f9f9}
.choice-btn .cd{font-size:12px;font-weight:400;color:#8a7e74;margin-top:2px}
.form-group{margin-bottom:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.form-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#6b7280;display:block;margin-bottom:5px}

.btn-primary{width:100%;padding:14px;background:#3AB7AE;color:#fff;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
.btn-primary:hover{background:#2F9990}
.btn-primary:disabled{background:#9ca3af;cursor:not-allowed}
.btn-back{background:none;border:none;color:#8a7e74;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;margin-bottom:14px;display:flex;align-items:center;gap:4px}
.policy-box{background:#f5f1eb;border-radius:10px;padding:14px 16px;font-size:13px;line-height:1.7;color:#4a4038;margin-bottom:16px}
.policy-box b{color:#2d2520}
.chk-row{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:#2d2520;margin-bottom:16px;cursor:pointer}
.chk-row input{margin-top:2px}
.date-scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.date-pill{flex-shrink:0;text-align:center;background:#fff;border:1.5px solid #e8dfd4;border-radius:10px;padding:8px 12px;cursor:pointer;font-family:'DM Sans',sans-serif}
.date-pill.on{background:#3AB7AE;border-color:#3AB7AE;color:#fff}
.date-pill .dow{font-size:10px;text-transform:uppercase;letter-spacing:.5px;opacity:.7}
.date-pill .dnum{font-size:15px;font-weight:700;margin-top:2px}
.slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot-btn{padding:10px 6px;border:1.5px solid #e8dfd4;border-radius:9px;background:#fff;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:#2d2520;cursor:pointer;text-align:center}
.slot-btn:hover{border-color:#3AB7AE;background:#f0f9f9}
.no-slots{color:#9ca3af;font-size:13px;font-style:italic;text-align:center;padding:20px 0}
.summary-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f0ebe0;font-size:13.5px}
.summary-row:last-child{border-bottom:none}
.summary-row .lbl{color:#8a7e74}
.summary-row .val{color:#2d2520;font-weight:600;text-align:right}
.msg{text-align:center;padding:50px 20px}
.msg-icon{font-size:44px;margin-bottom:12px}
.msg-title{font-size:20px;font-weight:700;font-family:'Italiana',serif;color:#2d2520;margin-bottom:8px}
.msg-sub{font-size:13.5px;color:#8a7e74;line-height:1.6}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a2332;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;text-align:center;max-width:90vw}
.toast.show{opacity:1}
</style>

<body>

</div>

<div class="wrap">

  <div id="mainContent">
    <div class="msg"><div class="msg-icon">⏳</div><div class="msg-title">Loading…</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPA_URL='https://fzresosiqafiyxfgeyvk.supabase.co';
const SUPA_KEY='sb_publishable_SG-1dCQntmSYtb1zwgl7Vg_-nAlTrsB';
const db=supabase.createClient(SUPA_URL,SUPA_KEY);

const SB_START_H=10, SB_END_H=19;
const CAT_ORDER=['massage','spirit','fitness','yoga','pilates','dance'];
const CAT_LABEL={massage:'Body Work',spirit:'Spirit Work',fitness:'Fitness',yoga:'Yoga',pilates:'Pilates',dance:'Dance'};
const CAT_ICON={massage:'🪷',spirit:'🦋',fitness:'💪',yoga:'🧘',pilates:'🤸',dance:'💃'};

let SpaData={services:[],rooms:[],therapists:[]};
let SpaAppointments=[];
let SBRegs=[];
let SBBookings=[];
let SB={step:1,sessionType:null,serviceId:null,guestType:null,firstName:'',lastName:'',email:'',phone:'',roomNumber:'',
        policyAccepted:false,prefType:'none',requestedTherapistId:null,date:null,start:null,therapistId:null,roomId:null,
        stayStart:null,stayEnd:null};

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200);}
function esc(s){return (s||'').replace(/</g,'&lt;');}
function minToHHMM(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function hhmmToMin(t){const[h,m]=t.split(':').map(Number);return h*60+m;}
function fmtT(t){const[h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';return((h%12)||12)+':'+String(m).padStart(2,'0')+' '+ap;}
function fmtDateLong(ds){const d=new Date(ds+'T12:00:00');return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});}

async function init(){
  try{
    const [{data:sd},{data:ad},{data:rd},{data:bd}]=await Promise.all([
      db.from('app_store').select('value').eq('key','spa_data').single(),
      db.from('app_store').select('value').eq('key','spa_appointments').single(),
      db.from('app_store').select('value').eq('key','regs').single(),
      db.from('app_store').select('value').eq('key','bookings').single(),
    ]);
    if(sd?.value) SpaData=sd.value;
    SpaAppointments=(ad?.value)||[];
    SBRegs=(rd?.value)||[];
    SBBookings=(bd?.value)||[];
  }catch(e){}
  const cancelId=new URLSearchParams(location.search).get('cancel');
  if(cancelId) return sbRenderCancelScreen(cancelId);
  renderStep();
}

// ── GUEST → FOLIO MATCHING ────────────────────────────────────────────────
// Same name-only matching convention used by the admin Spa dashboard
// (spaFindGuestRegForAppt in modules/spa.js), strengthened here with the
// room number the guest entered: an exact name+room match is used
// immediately; a name-only match is kept as a fallback so we don't leave a
// hotel guest's charge unposted just because they mistyped their room.
function sbFindGuestReg(clientName,roomNumber){
  const key=(clientName||'').toLowerCase().replace(/\s+/g,' ').trim();
  if(!key) return null;
  const rn=(roomNumber||'').toLowerCase().replace(/\s+/g,' ').trim();
  let fallback=null;
  for(const reg of SBRegs){
    const idx=(reg.guests||[]).findIndex(g=>(g.name||'').toLowerCase().replace(/\s+/g,' ').trim()===key);
    if(idx>=0){
      const match={reg,guest:reg.guests[idx],guestIdx:idx};
      if(rn&&(reg.room||'').toLowerCase().replace(/\s+/g,' ').trim()===rn) return match;
      if(!fallback) fallback=match;
    }
  }
  return fallback;
}

// Room Only / BBC / Restore & Renew guests have no reg record — their room
// and charges live directly on the booking (bookingType==='room_only').
// Without this, a spa charge for one of these guests silently never posts
// anywhere (sbFindGuestReg finds nothing, the whole auto-post block is
// skipped) even though folioStatus still gets left as PENDING as if it
// worked. Mirrors sbFindGuestReg's name+room matching convention.
function sbFindGuestBooking(clientName,roomNumber){
  const key=(clientName||'').toLowerCase().replace(/\s+/g,' ').trim();
  if(!key) return null;
  const rn=(roomNumber||'').toLowerCase().replace(/\s+/g,' ').trim();
  let fallback=null;
  for(const bk of SBBookings){
    if(bk.bookingType!=='room_only') continue;
    if((bk.leaderName||'').toLowerCase().replace(/\s+/g,' ').trim()!==key) continue;
    const rooms=(bk.blockedRooms||[]).map(r=>(r||'').toLowerCase().replace(/\s+/g,' ').trim());
    if(rn&&rooms.includes(rn)) return {bk};
    if(!fallback) fallback={bk};
  }
  return fallback;
}

function setStep(n){SB.step=n;renderStep();window.scrollTo({top:0,behavior:'smooth'});}

function renderDots(total){
  document.getElementById('stepDots').innerHTML=Array.from({length:total},(_,i)=>
    `<div class="step-dot ${i+1<=SB.step?'on':''}"></div>`).join('');
}

// Group ceremonies price per-person once the minimum group size is met;
// below that, specific flat prices per headcount (not a formula — these are
// Darlene's real negotiated small-group rates, so no interpolation).
function spaGroupPrice(s,n){
  if(!s.groupPricing||!n||n<1)return null;
  const gp=s.groupPricing;
  // Explicit per-headcount override (e.g. a special solo rate) always wins,
  // checked before the flat-fee/per-person formulas below.
  if(gp.belowMin&&gp.belowMin[n]!=null)return gp.belowMin[n];
  // Flat-fee model (e.g. Private Yoga/Fitness): one flat rate covers up to
  // flatFeeMax people, each guest beyond that adds perPersonUSD.
  if(gp.flatFee!=null)return gp.flatFee+Math.max(0,n-(gp.flatFeeMax||0))*(gp.perPersonUSD||0);
  if(n>=gp.minGroup)return gp.perPersonUSD*n;
  return null;
}

function renderStep(){
  const el=document.getElementById('mainContent');
  if(SB.step===1) return renderStep1_SessionType(el);
  if(SB.step===2) return renderStep2_Service(el);
  if(SB.step===2.5) return renderStep2b_GroupCount(el);
  if(SB.step===3) return renderStep3_GuestType(el);
  if(SB.step===4) return SB.guestType==='hotel' ? renderStep4_Hotel(el) : renderStep4_Offsite(el);
  if(SB.step===5) return renderStep5_Preference(el);
  if(SB.step===6) return renderStep6_DateTime(el);
  if(SB.step===7) return renderStep7_Confirm(el);
}

// ── STEP 1 — ONE-ON-ONE OR GROUP CEREMONY ────────────────────────────────
function renderStep1_SessionType(el){
  renderDots(7);
  el.innerHTML=`<div class="card">
    <div class="section-title">What Would You Like to Book?</div>
    <div class="section-sub">Choose the kind of experience you're looking for.</div>
    <div class="choice-btn" onclick="sbPickSessionType('individual')">One-on-One Treatment<div class="cd">Massage, bodywork, private classes and readings — just for you</div></div>
    <div class="choice-btn" onclick="sbPickSessionType('group')">Group Ceremony<div class="cd">Temazcal, Cacao &amp; Sound Healing, and other shared experiences</div></div>
  </div>`;
}
function sbPickSessionType(t){SB.sessionType=t;setStep(2);}

// ── STEP 2 — SERVICE ─────────────────────────────────────────────────────
function renderStep2_Service(el){
  renderDots(7);
  const active=SpaData.services.filter(s=>s.active && s.duration!=null && (s.groupPricing?true:s.price!=null) && (s.sessionType||'individual')===SB.sessionType);
  let html=`<button class="btn-back" onclick="setStep(1)">&#8249; Back</button><div class="card"><div class="section-title">Choose a Treatment</div><div class="section-sub">Select the service you'd like to book.</div>`;
  if(!active.length){
    html+=`<div class="no-slots">Nothing here is ready to book yet — please check back soon or contact us directly.</div>`;
  }
  CAT_ORDER.forEach(cat=>{
    const list=active.filter(s=>s.category===cat);
    if(!list.length) return;
    html+=`<div class="cat-label">${CAT_LABEL[cat]}</div>`;
    list.forEach(s=>{
      const priceLbl=s.groupPricing?('from $'+spaGroupPrice(s,s.groupPricing.minGuests||1)+' USD'):('$'+s.price+' USD');
      html+=`<div class="svc-card" onclick="sbPickService('${s.id}')">
        <div class="svc-name">${esc(s.name)}</div>
        ${s.description?`<div class="svc-desc">${esc(s.description)}</div>`:''}
        <div class="svc-meta"><span>${s.duration} min</span><span class="svc-price">${priceLbl}</span></div>
      </div>`;
    });
  });
  html+=`</div>`;
  el.innerHTML=html;
}
function sbPickService(id){
  SB.serviceId=id;
  const svc=SpaData.services.find(s=>s.id===id);
  if(svc&&svc.groupPricing){SB.guestCount=SB.guestCount||svc.groupPricing.minGroup;SB.step=2.5;renderStep();return;}
  setStep(3);
}

// ── STEP 2b — GROUP SIZE (group ceremonies only) ─────────────────────────
function renderStep2b_GroupCount(el){
  renderDots(7);
  const svc=SpaData.services.find(s=>s.id===SB.serviceId);
  const gp=svc.groupPricing;
  const minGuests=gp.minGuests||1;
  const n=SB.guestCount||gp.minGroup;
  const price=spaGroupPrice(svc,n);
  const showWarn=gp.discourageSolo&&n>=minGuests&&n<=2;
  const belowMinGuests=n<minGuests;
  el.innerHTML=`<button class="btn-back" onclick="setStep(2)">&#8249; Back</button>
    <div class="card">
      <div class="section-title">${esc(svc.name)}</div>
      <div class="section-sub">How many guests will be joining? (${gp.minGroup}+ gets the group rate of $${gp.perPersonUSD}/person)</div>
      <div class="form-group"><label class="form-label">Number of Guests *</label><input class="form-input" type="number" min="${minGuests}" id="sbGuestCountInput" value="${n}" oninput="sbUpdateGroupCount(this.value)"></div>
      <div style="font-size:17px;font-weight:700;color:#2d6a6a;margin:16px 0">${price!=null?'Total: $'+price+' USD':(belowMinGuests?'':'That group size isn\'t priced yet — please contact us directly.')}</div>
      ${belowMinGuests?`<div class="no-slots">We don't offer this as a one-on-one experience — minimum ${minGuests} guests.</div>`:''}
      ${showWarn?`<div class="no-slots" style="color:#92400e;background:#fffbeb;border-color:#fde68a">We don't usually recommend booking this for 1–2 people unless you're a couple wanting a private experience — reach out to us to find out when we're hosting a group ${esc(svc.name)} you can join instead.</div>`:''}
      <button class="btn-primary" onclick="sbConfirmGroupCount()" ${price==null?'disabled':''}>Continue</button>
    </div>`;
}
function sbUpdateGroupCount(v){SB.guestCount=parseInt(v)||1;renderStep2b_GroupCount(document.getElementById('mainContent'));}
function sbConfirmGroupCount(){
  const svc=SpaData.services.find(s=>s.id===SB.serviceId);
  SB.groupTotalPrice=spaGroupPrice(svc,SB.guestCount);
  setStep(3);
}

// ── STEP 3 — GUEST TYPE ──────────────────────────────────────────────────
function renderStep3_GuestType(el){
  renderDots(7);
  el.innerHTML=`
    <button class="btn-back" onclick="setStep(2)">&#8249; Back</button>
    <div class="card">
      <div class="section-title">Are you staying at Amansala?</div>
      <div class="section-sub">This helps us arrange payment for your treatment.</div>
      <div class="choice-btn" onclick="sbPickGuestType('hotel')">I am staying at Amansala<div class="cd">Charged to your room — no payment needed now</div></div>
      <div class="choice-btn" onclick="sbPickGuestType('offsite')">I am not staying at Amansala<div class="cd">Advance payment required to reserve your spot</div></div>
    </div>`;
}
function sbPickGuestType(t){SB.guestType=t;setStep(4);}

// ── STEP 4a — HOTEL GUEST ────────────────────────────────────────────────
function renderStep4_Hotel(el){
  renderDots(7);
  el.innerHTML=`
    <button class="btn-back" onclick="setStep(3)">&#8249; Back</button>
    <div class="card">
      <div class="section-title">Your Stay</div>
      <div class="section-sub">Our front desk will confirm your reservation and charge your room folio.</div>
      <div class="form-row">
        <div><label class="form-label">First Name *</label><input class="form-input" id="sbFirst" value="${esc(SB.firstName)}"></div>
        <div><label class="form-label">Last Name *</label><input class="form-input" id="sbLast" value="${esc(SB.lastName)}"></div>
      </div>
      <div class="form-group"><label class="form-label">Room Number *</label><input class="form-input" id="sbRoom" placeholder="e.g. GV3" value="${esc(SB.roomNumber)}"></div>
      <div class="form-group"><label class="form-label">Email *</label><input class="form-input" id="sbEmail" type="email" placeholder="So we can send your confirmation" value="${esc(SB.email)}"></div>
      <div class="form-group"><label class="form-label">Phone *</label><input class="form-input" id="sbPhoneHotel" type="tel" value="${esc(SB.phone)}"></div>
      <button class="btn-primary" onclick="sbSubmitHotel()">Continue</button>
    </div>`;
}
// Confines the date picker (and the final booking check) to the guest's
// actual stay window — Darlene's request: a guest who hasn't checked in
// yet shouldn't be able to book (or be booked for) a spa service before
// their arrival date, or after they've checked out. Looks up the parent
// booking fresh (regs have no dates of their own — only the booking they
// belong to does) so a same-minute check-in is picked up correctly.
async function sbLookupStayWindow(clientName,roomNumber){
  try{
    const [{data:rd},{data:bd}]=await Promise.all([
      db.from('app_store').select('value').eq('key','regs').single(),
      db.from('app_store').select('value').eq('key','bookings').single(),
    ]);
    const latestRegs=(rd?.value)||[];
    const latestBookings=(bd?.value)||[];
    SBRegs=latestRegs;SBBookings=latestBookings;
    const regMatch=sbFindGuestReg(clientName,roomNumber);
    if(regMatch){
      const bk=latestBookings.find(b=>b.id===regMatch.reg.bookingId);
      if(bk&&bk.startDate&&bk.endDate) return{start:bk.startDate,end:bk.endDate};
    }
    const bkMatch=sbFindGuestBooking(clientName,roomNumber);
    if(bkMatch&&bkMatch.bk.startDate&&bkMatch.bk.endDate) return{start:bkMatch.bk.startDate,end:bkMatch.bk.endDate};
  }catch(e){}
  return null; // no confirmed match — don't restrict rather than risk a false block
}
async function sbSubmitHotel(){
  const first=document.getElementById('sbFirst').value.trim();
  const last=document.getElementById('sbLast').value.trim();
  const room=document.getElementById('sbRoom').value.trim();
  const email=document.getElementById('sbEmail').value.trim();
  const phone=document.getElementById('sbPhoneHotel').value.trim();
  if(!first||!last){showToast('Please enter your name.');return;}
  if(!room){showToast('Please enter your room number.');return;}
  if(!email){showToast('Please enter your email so we can send your confirmation.');return;}
  if(!phone){showToast('Please enter your phone number.');return;}
  SB.firstName=first;SB.lastName=last;SB.roomNumber=room;SB.email=email;SB.phone=phone;
  const btn=document.querySelector('.btn-primary');
  const origLabel=btn?btn.textContent:'';
  if(btn){btn.disabled=true;btn.textContent='Checking your stay…';}
  const window_=await sbLookupStayWindow(first+' '+last,room);
  SB.stayStart=window_?window_.start:null;
  SB.stayEnd=window_?window_.end:null;
  if(btn){btn.disabled=false;btn.textContent=origLabel;}
  setStep(5);
}

// ── STEP 4b — OFFSITE GUEST ──────────────────────────────────────────────
function renderStep4_Offsite(el){
  renderDots(7);
  el.innerHTML=`
    <button class="btn-back" onclick="setStep(3)">&#8249; Back</button>
    <div class="card">
      <div class="section-title">Welcome to Amansala</div>
      <div class="policy-box">
        Advance payment is required to reserve your service.<br><br>
        <b>Spa guests receive $20 USD off entrance to the Amansala Beach Club</b> on the day of their appointment.<br><br>
        Please review our cancellation policy: services must be cancelled at least 12 hours in advance, or the full charge applies.
      </div>
      <label class="chk-row"><input type="checkbox" id="sbPolicyChk"> I agree to the cancellation policy above</label>
      <div class="form-row">
        <div><label class="form-label">First Name *</label><input class="form-input" id="sbFirst" value="${esc(SB.firstName)}"></div>
        <div><label class="form-label">Last Name *</label><input class="form-input" id="sbLast" value="${esc(SB.lastName)}"></div>
      </div>
      <div class="form-group"><label class="form-label">Email *</label><input class="form-input" id="sbEmail" type="email" value="${esc(SB.email)}"></div>
      <div class="form-group"><label class="form-label">Phone *</label><input class="form-input" id="sbPhone" type="tel" value="${esc(SB.phone)}"></div>
      <button class="btn-primary" onclick="sbSubmitOffsite()">Continue</button>
    </div>`;

function sbCandidateTherapists(){

  else if(SB.prefType==='female'||SB.prefType==='male') list=list.filter(t=>t.gender===SB.prefType);

function sbSlotFree(therapistId,roomId,dateStr,startMin,duration){
  const endMin=startMin+duration;
  return !SpaAppointments.some(a=>{
    if(a.date!==dateStr||a.status==='CANCELLED') return false;
    const sameTher=a.therapistId===therapistId;
    const sameRoom=roomId&&a.roomId===roomId;
    if(!sameTher&&!sameRoom) return false;
    const aStart=hhmmToMin(a.start), aEnd=aStart+(a.duration||60);
    return startMin<aEnd && endMin>aStart;
  });
}
// Simple stand-in for the fair-rotation queue (full claim/accept flow is a
// later phase): among eligible+free therapists, prefer whoever has fewest
// upcoming appointments, so bookings don't pile onto the first name in the list.
function sbAutoAssign(candidates,dateStr,startMin,duration){
  const free=candidates.filter(t=>sbSlotFree(t.id,null,dateStr,startMin,duration));
  if(!free.length) return null;
  const svc=SpaData.services.find(s=>s.id===SB.serviceId);
  const freeRoom=svc.roomRequired ? SpaData.rooms.find(r=>!SpaAppointments.some(a=>a.date===dateStr&&a.roomId===r.id&&a.status!=='CANCELLED'&&startMin<hhmmToMin(a.start)+(a.duration||60)&&(startMin+duration)>hhmmToMin(a.start))) : null;
  if(svc.roomRequired && !freeRoom) return null;
  const counts=free.map(t=>({t,n:SpaAppointments.filter(a=>a.therapistId===t.id&&a.status!=='CANCELLED').length}));
  counts.sort((a,b)=>a.n-b.n);
  return {therapist:counts[0].t, room:freeRoom};
}
// Every eligible+free therapist at this exact time — not just the least-busy
// one — so the guest can pick who they want instead of us silently deciding.
function sbAllFreeAssignments(candidates,dateStr,startMin,duration){
  const free=candidates.filter(t=>sbSlotFree(t.id,null,dateStr,startMin,duration));
  if(!free.length) return [];
  const svc=SpaData.services.find(s=>s.id===SB.serviceId);
  if(!svc.roomRequired) return free.map(t=>({therapist:t,room:null}));
  const freeRooms=SpaData.rooms.filter(r=>!SpaAppointments.some(a=>a.date===dateStr&&a.roomId===r.id&&a.status!=='CANCELLED'&&startMin<hhmmToMin(a.start)+(a.duration||60)&&(startMin+duration)>hhmmToMin(a.start)));
  if(!freeRooms.length) return [];
  return free.slice(0,freeRooms.length).map((t,i)=>({therapist:t,room:freeRooms[i]}));
}
function sbNextDays(n){
  const out=[];
  const today=new Date();today.setHours(0,0,0,0);
  for(let i=0;i<n;i++){const d=new Date(today.getTime()+i*86400000);out.push(d);}
  return out;
}
// Clamps the bookable date range to the guest's actual stay (SB.stayStart/
// stayEnd, looked up in sbSubmitHotel) — a guest who hasn't checked in yet
// can still book ahead, but only for dates within their real stay window,
// not today just because today happens to fall in the next-14-days list.
function sbBookableDays(){
  const today=new Date();today.setHours(0,0,0,0);
  let start=today, end=new Date(today.getTime()+13*86400000);
  if(SB.stayStart){const ss=new Date(SB.stayStart+'T00:00:00');if(ss>start)start=ss;}
  if(SB.stayEnd){const se=new Date(SB.stayEnd+'T00:00:00');if(se<end)end=se;}
  const out=[];
  for(let d=new Date(start);d<=end;d=new Date(d.getTime()+86400000))out.push(new Date(d));
  return out;
}

async function sbFinalConfirm(){

  try{
    // Revalidate against the latest data right before writing — someone else
    // may have booked this exact slot in the time since it was shown.
    const {data:ad}=await db.from('app_store').select('value').eq('key','spa_appointments').single();
    const latest=(ad?.value)||[];
    const conflict=latest.some(a=>{
      if(a.date!==SB.date||a.status==='CANCELLED') return false;
      const sameTher=a.therapistId===SB.therapistId;
      const sameRoom=SB.roomId&&a.roomId===SB.roomId;

      const svc=SpaData.services.find(s=>s.id===SB.serviceId);
      const aStart=hhmmToMin(a.start),aEnd=aStart+(a.duration||60);
      const start=hhmmToMin(SB.start),end=start+svc.duration;
      return start<aEnd && end>aStart;
    });
    if(conflict){
      showToast('That time was just booked by someone else — please pick another.');

        <div class="msg-icon">🌴</div>
        <div class="msg-title">You're Booked!</div>
        <div class="msg-sub">See you for your <b>${esc(svc.name)}</b> on ${fmtDateLong(SB.date)} at ${fmtT(SB.start)}.<br><br>${folioPosted?'The charge has been added to your room folio.':'The charge will appear on your room folio. Our team will confirm your reservation.'} We've sent the details — including your meeting location and a cancellation link — to ${esc(appt.email)}.</div>
      </div>`;
    }else{
      el.innerHTML=`<div class="msg">
        <div class="msg-icon">🌴</div>
        <div class="msg-title">Almost There!</div>
        <div class="msg-sub">Your <b>${esc(svc.name)}</b> is reserved for ${fmtDateLong(SB.date)} at ${fmtT(SB.start)}.<br><br>Our team will reach out to <b>${esc(SB.email)}</b> shortly to collect payment and confirm your appointment.</div>
      </div>`;
    }
  }catch(e){
    showToast('Something went wrong — please try again.');
    btn.disabled=false;btn.textContent='Confirm Booking';
  }
}

// ── GUEST-FACING CANCELLATION (reached via ?cancel=<apptId> link in the
// confirmation email) — enforces the 12-hour cutoff, reverses the folio
// charge if one was auto-posted, and emails a cancellation confirmation. ──
function sbApptDateTime(appt){return new Date(appt.date+'T'+appt.start+':00');}
function sbRenderCancelScreen(apptId){
  document.getElementById('stepDots').style.display='none';
  const el=document.getElementById('mainContent');
  const appt=SpaAppointments.find(a=>a.id===apptId);
  if(!appt){
    el.innerHTML=`<div class="msg"><div class="msg-icon">🤔</div><div class="msg-title">Appointment Not Found</div><div class="msg-sub">We couldn't find that appointment. Please contact us directly if you need to make a change.</div></div>`;
    return;
  }
  const svc=SpaData.services.find(s=>s.id===appt.serviceId);
  if(appt.status==='CANCELLED'){
    el.innerHTML=`<div class="msg"><div class="msg-icon">✓</div><div class="msg-title">Already Cancelled</div><div class="msg-sub">This appointment has already been cancelled — nothing further to do.</div></div>`;
    return;
  }
  const hoursLeft=(sbApptDateTime(appt)-new Date())/3600000;
  if(hoursLeft<12){
    el.innerHTML=`<div class="msg"><div class="msg-icon">⏰</div><div class="msg-title">Too Late to Cancel Online</div><div class="msg-sub">Your <b>${esc(svc?.name||'appointment')}</b> on ${fmtDateLong(appt.date)} at ${fmtT(appt.start)} is less than 12 hours away, so it can't be cancelled online. Please contact us directly at the front desk if you still need to cancel.</div></div>`;
    return;
  }
  el.innerHTML=`<div class="card">
    <div class="section-title">Cancel This Appointment?</div>
    <div class="summary-row"><span class="lbl">Service</span><span class="val">${esc(svc?.name||'')}</span></div>
    <div class="summary-row"><span class="lbl">Date</span><span class="val">${fmtDateLong(appt.date)}</span></div>
    <div class="summary-row"><span class="lbl">Time</span><span class="val">${fmtT(appt.start)}</span></div>
    <div class="section-sub" style="margin-top:14px">Cancelling is free since it's more than 12 hours out. ${appt.folioStatus==='POSTED'?'The charge on your room folio will be removed.':''}</div>
    <button class="btn-primary" style="background:#b45309" id="sbCancelBtn" onclick="sbDoCancel('${apptId}')">Yes, Cancel My Appointment</button>
  </div>`;
}
async function sbDoCancel(apptId){
  const btn=document.getElementById('sbCancelBtn');
  if(btn){btn.disabled=true;btn.textContent='Cancelling…';}
  try{
    const {data:ad}=await db.from('app_store').select('value').eq('key','spa_appointments').single();
    const latest=(ad?.value)||[];
    const idx=latest.findIndex(a=>a.id===apptId);
    if(idx<0){showToast('Appointment not found.');return;}
    const appt=latest[idx];
    if(appt.status==='CANCELLED'){showToast('Already cancelled.');SpaAppointments=latest;sbRenderCancelScreen(apptId);return;}
    if((sbApptDateTime(appt)-new Date())/3600000<12){showToast('Too close to your appointment time to cancel online.');SpaAppointments=latest;sbRenderCancelScreen(apptId);return;}
    if(appt.folioStatus==='POSTED'&&appt.folioChargeId&&appt.folioRegId){
      try{
        const {data:rd}=await db.from('app_store').select('value').eq('key','regs').single();
        const latestRegs=(rd?.value)||[];
        const ri=latestRegs.findIndex(r=>r.id===appt.folioRegId);
        if(ri>=0&&Array.isArray(latestRegs[ri].charges)){
          latestRegs[ri].charges=latestRegs[ri].charges.filter(c=>c.id!==appt.folioChargeId);
          await db.from('app_store').upsert({key:'regs',value:latestRegs,updated_at:new Date().toISOString()});
        }
      }catch(e){}
    }else if(appt.folioStatus==='POSTED'&&appt.folioChargeId&&appt.folioBkId){
      try{
        const {data:bd}=await db.from('app_store').select('value').eq('key','bookings').single();
        const latestBookings=(bd?.value)||[];
        const bi=latestBookings.findIndex(b=>b.id===appt.folioBkId);
        if(bi>=0&&Array.isArray(latestBookings[bi].charges)){
          latestBookings[bi].charges=latestBookings[bi].charges.filter(c=>c.id!==appt.folioChargeId);
          await db.from('app_store').upsert({key:'bookings',value:latestBookings,updated_at:new Date().toISOString()});
        }
      }catch(e){}
    }
    appt.status='CANCELLED';
    appt.cancelledAt=new Date().toISOString();
    appt.folioStatus=appt.folioStatus==='POSTED'?'REVERSED':appt.folioStatus;
    latest[idx]=appt;
    await db.from('app_store').upsert({key:'spa_appointments',value:latest,updated_at:new Date().toISOString()});
    SpaAppointments=latest;
    const svc=SpaData.services.find(s=>s.id===appt.serviceId);
    if(appt.email) await sbSendCancelEmail(appt,svc);
    const el=document.getElementById('mainContent');
    el.innerHTML=`<div class="msg"><div class="msg-icon">✓</div><div class="msg-title">Cancelled</div><div class="msg-sub">Your appointment has been cancelled${appt.folioStatus==='REVERSED'?' and the charge removed from your folio' :''}. We've sent you a confirmation email.</div></div>`;
  }catch(e){
    showToast('Something went wrong — please try again.');
    if(btn){btn.disabled=false;btn.textContent='Yes, Cancel My Appointment';}
  }
}

init();
</script>
</body>
</html>
