<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book a Spa Treatment · Amansala</title>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://js.stripe.com/v3/"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#faf7f0;color:#2d2520;min-height:100vh}
.header{background:#3AB7AE;padding:20px;text-align:center}
.header-logo{height:36px}
.header-sub{color:rgba(255,255,255,.7);font-size:12.5px;margin-top:3px;letter-spacing:.3px}
.wrap{max-width:520px;margin:0 auto;padding:26px 16px 70px}
.step-dots{display:flex;justify-content:center;gap:6px;margin-bottom:22px}
.step-dot{width:7px;height:7px;border-radius:50%;background:#e0d5c4}
.step-dot.on{background:#3AB7AE}
.card{background:#fff;border-radius:14px;border:1px solid #e8dfd4;padding:22px 20px;margin-bottom:14px}
.section-title{font-size:19px;font-weight:600;font-family:'Italiana',serif;color:#2d2520;margin-bottom:4px}
.section-sub{font-size:13px;color:#8a7e74;margin-bottom:16px;line-height:1.5}
.svc-card{background:#fff;border-radius:12px;border:1.5px solid #e8dfd4;padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.svc-card:hover{border-color:#3AB7AE;box-shadow:0 2px 8px rgba(45,106,106,.1)}
.svc-name{font-size:15px;font-weight:600;color:#2d2520}
.svc-desc{font-size:12px;color:#8a7e74;margin-top:2px}
.svc-meta{display:flex;gap:10px;margin-top:6px;font-size:12px;color:#4a4038}
.svc-price{font-weight:700;color:#a05a35}
.cat-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#a89a86;margin:18px 0 8px}
.cat-label:first-child{margin-top:0}
.cat-fold{margin:0}.cat-sum{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;padding:6px 2px}.cat-sum::-webkit-details-marker{display:none}.cat-sum::after{content:'+';font-size:18px;font-weight:600;color:#8a7e74}.cat-fold[open]>.cat-sum::after{content:'\2212'}
.choice-btn{width:100%;text-align:left;background:#fff;border:1.5px solid #e8dfd4;border-radius:12px;padding:14px 16px;margin-bottom:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;color:#2d2520;transition:border-color .15s,background .15s}
.choice-btn:hover{border-color:#3AB7AE;background:#f0f9f9}
.choice-btn .cd{font-size:12px;font-weight:400;color:#8a7e74;margin-top:2px}
.form-group{margin-bottom:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.form-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#6b7280;display:block;margin-bottom:5px}
.form-input,.form-select{width:100%;padding:10px 12px;border:1.5px solid #e8dfd4;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:14px;color:#2d2520;outline:none;background:#fff}
.form-input:focus,.form-select:focus{border-color:#3AB7AE}
.btn-primary{width:100%;padding:14px;background:#3AB7AE;color:#fff;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
.btn-primary:hover{background:#2F9990}
.btn-primary:disabled{background:#9ca3af;cursor:not-allowed}
.btn-back{background:none;border:none;color:#8a7e74;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;margin-bottom:14px;display:flex;align-items:center;gap:4px}
.policy-box{background:#f5f1eb;border-radius:10px;padding:14px 16px;font-size:13px;line-height:1.7;color:#4a4038;margin-bottom:16px}
.policy-box b{color:#2d2520}
.chk-row{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:#2d2520;margin-bottom:16px;cursor:pointer}
.chk-row input{margin-top:2px}
.date-scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.date-pill{flex-shrink:0;text-align:center;background:#fff;border:1.5px solid #e8dfd4;border-radius:10px;padding:8px 12px;cursor:pointer;font-family:'DM Sans',sans-serif}
.date-pill.on{background:#3AB7AE;border-color:#3AB7AE;color:#fff}
.date-pill .dow{font-size:10px;text-transform:uppercase;letter-spacing:.5px;opacity:.7}
.date-pill .dnum{font-size:15px;font-weight:700;margin-top:2px}
.slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot-btn{padding:10px 6px;border:1.5px solid #e8dfd4;border-radius:9px;background:#fff;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:#2d2520;cursor:pointer;text-align:center}
.slot-btn:hover{border-color:#3AB7AE;background:#f0f9f9}
.no-slots{color:#9ca3af;font-size:13px;font-style:italic;text-align:center;padding:20px 0}
.summary-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f0ebe0;font-size:13.5px}
.summary-row:last-child{border-bottom:none}
.summary-row .lbl{color:#8a7e74}
.summary-row .val{color:#2d2520;font-weight:600;text-align:right}
.msg{text-align:center;padding:50px 20px}
.msg-icon{font-size:44px;margin-bottom:12px}
.msg-title{font-size:20px;font-weight:700;font-family:'Italiana',serif;color:#2d2520;margin-bottom:8px}
.msg-sub{font-size:13.5px;color:#8a7e74;line-height:1.6}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a2332;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;text-align:center;max-width:90vw}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="header">
  <img class="header-logo" src="logo-amansala-white.png" alt="Amansala">
  <div class="header-sub">Book a Spa Treatment</div>
</div>

<div class="wrap">
  <div class="step-dots" id="stepDots"></div>
  <div id="mainContent">
    <div class="msg"><div class="msg-icon">⏳</div><div class="msg-title">Loading…</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// Everything goes through netlify/functions/spa-public.js (2026-11-02): this page used to read every spa client, hotel
// guest and staff schedule with the public database key, and charge folios / save appointments / send emails itself.
const SPA_FN='/.netlify/functions/spa-public';
async function spaApi(body){
  const r=await fetch(SPA_FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok&&!d.reason)throw new Error(d.error||'Something went wrong — please try again.');
  return d;
}

const SB_START_H=10, SB_END_H=19;
// The property is in Tulum, Mexico (America/Cancun) — a guest or staff
// member browsing from a different timezone must still see "today"/"now" as
// Tulum's, not their device's, or past time slots keep showing as bookable
// (Darlene's call 2026-09-16).
function sbTulumNow(){
  const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Cancun',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  const get=t=>parts.find(p=>p.type===t)?.value;
  let hour=parseInt(get('hour'),10);if(hour===24)hour=0;
  return {dateStr:`${get('year')}-${get('month')}-${get('day')}`,minutes:hour*60+parseInt(get('minute'),10)};
}
// Guests need 2 hours' notice (Darlene 2026-11-01); anything sooner is booked in person with a spa representative.
const SB_MIN_NOTICE_MIN=120;
const SB_WALKIN_MSG='Online bookings need at least 2 hours\' notice before the start of a service. Please request to speak to a human, or you can always book with our onsite hosts.';
const SB_WA_LINK='https://wa.me/5215592252190?text='+encodeURIComponent('Hello, I would like to book a spa service and speak with someone.');
function sbTooSoon(ds,m){const tn=sbTulumNow();return ds===tn.dateStr&&m<tn.minutes+SB_MIN_NOTICE_MIN;}
const CAT_ORDER=['massage','spirit','fitness','yoga','pilates','dance'];
const CAT_LABEL={massage:'Body Work',spirit:'Spirit Work',fitness:'Fitness',yoga:'Yoga',pilates:'Pilates',dance:'Dance'};
const CAT_ICON={massage:'🪷',spirit:'🦋',fitness:'💪',yoga:'🧘',pilates:'🤸',dance:'💃'};

let SpaData={services:[],rooms:[],therapists:[]};
let SpaAppointments=[];   // busy times only (no names) -- or, on a confirmation / cancel link, that one appointment
let SBStaffAccounts=[];   // therapists' days off only
// Staff-editable rotation rules (booking-hub.html's Spa > Auto-Assign screen, modules/
// spa-rotation-settings.js) -- these defaults are only ever used until staff saves that
// screen once; after that, whatever they set there takes over automatically.
let SB_BLOCKS=[];   // hours the office blocked for a therapist (Spa calendar > Block time, app_store spa_time_blocks): never offered
let SB_ROT={femaleOrder:['Laura','Laura','Gabby','Graciela'],femaleFallback:'Rosario',malePrimary:'Julian',malePrimaryCap:4,maleSecondary:'Miguel',noPreferenceFirst:'male',mariaName:'Maria Luisa',mariaStageSize:2,mariaBreakMinutes:45,mariaDailyCap:4,generalBreakAfter:3,generalBreakMinutes:30,generalDailyCap:7};
let SB={step:1,sessionType:null,serviceId:null,guestType:null,firstName:'',lastName:'',email:'',phone:'',roomNumber:'',
        policyAccepted:false,prefType:'none',requestedTherapistId:null,date:null,start:null,therapistId:null,roomId:null,tipAmount:0,rotationGroup:null,rotationName:null,
        stayStart:null,stayEnd:null};

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3200);}
function esc(s){return (s||'').replace(/</g,'&lt;');}
function minToHHMM(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function hhmmToMin(t){const[h,m]=t.split(':').map(Number);return h*60+m;}
function fmtT(t){const[h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';return((h%12)||12)+':'+String(m).padStart(2,'0')+' '+ap;}
function fmtDateLong(ds){const d=new Date(ds+'T12:00:00');return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});}

async function init(){
  try{
    const r=await fetch(SPA_FN+'?action=init');
    const d=await r.json();
    if(d.spaData)SpaData=d.spaData;
    SpaAppointments=d.busy||[];
    SBStaffAccounts=d.staff||[];
    if(d.rotation)SB_ROT={...SB_ROT,...d.rotation};
    SB_BLOCKS=Array.isArray(d.blocks)?d.blocks:[];
  }catch(e){}
  // a confirmation / cancel link shows that one appointment
  const _linkId=new URLSearchParams(location.search).get('cancel')||new URLSearchParams(location.search).get('confirmation');
  if(_linkId){try{const r=await fetch(SPA_FN+'?action=appt&id='+encodeURIComponent(_linkId));const d=await r.json();SpaAppointments=d.appt?[d.appt]:[];}catch(e){SpaAppointments=[];}}
  const cancelId=new URLSearchParams(location.search).get('cancel');
  if(cancelId) return sbRenderCancelScreen(cancelId);
  // Time changes always go through a human now (Jorge's boss's ask
  // 2026-09-26) — an old ?reschedule= link (from an email sent before this
  // change) still resolves, just to a "contact us" message instead of a
  // self-service flow.
  const rescheduleId=new URLSearchParams(location.search).get('reschedule');
  if(rescheduleId) return sbRenderRescheduleScreen();
  const confirmationId=new URLSearchParams(location.search).get('confirmation');
  if(confirmationId) return sbRenderConfirmationScreen(confirmationId);
  await sbLoadGuestLink();
  renderStep();
}

// Special offer link (e.g. /spa-crystal -> ?offer=crystal): only services flagged with that offer are shown, and the general
// page hides them. A service's `offer` field is set in the spa data.
const SB_OFFER=(new URLSearchParams(location.search).get('offer')||'').toLowerCase();
function sbOfferFilter(s){return SB_OFFER?String(s.offer||'').toLowerCase()===SB_OFFER:!s.offer;}
// Beach Club perk: entrance is FREE for spa services in October and November 2026 (Darlene 2026-10-14); otherwise $20 USD off on the day.
function sbBeachClubLine(){
  const d=String(SB.date||'');
  if(/^2026-(10|11)-/.test(d))return '<b>Entrance to the Amansala Beach Club is free</b> on the day of your appointment when you book a spa service in October or November.';
  return '<b>Spa guests receive $20 USD off entrance to the Amansala Beach Club</b> on the day of their appointment.';
}
// Personal link from Lana (WhatsApp, /spa?g=...): the guest is already known, so "Are you staying at Amansala?" and
// "Your Stay" are skipped and their name, room, email and phone come filled in (Jorge 2026-11-04). "Not you?" clears it.
async function sbLoadGuestLink(){
  const g=new URLSearchParams(location.search).get('g');if(!g)return;
  try{
    const d=await (await fetch(SPA_FN+'?action=guest&g='+encodeURIComponent(g))).json();
    if(!d||!d.name||!d.room)return;
    const parts=String(d.name).trim().split(/\s+/);
    Object.assign(SB,{linked:true,guestType:'hotel',firstName:parts[0],lastName:parts.slice(1).join(' ')||parts[0],roomNumber:d.room,email:d.email||'',phone:d.phone||'',stayStart:d.start||null,stayEnd:d.end||null});
  }catch(e){}
}
function sbNotMe(){SB.linked=false;SB.guestType=null;SB.firstName=SB.lastName=SB.roomNumber=SB.email=SB.phone='';SB.stayStart=SB.stayEnd=null;setStep(3);}
function setStep(n){
  // Back from Date & Time on a service without a therapist preference: step 5 would only bounce forward again
  if(n===5&&SB.step>5){const sv=(SpaData.services||[]).find(x=>x.id===SB.serviceId);if(sv&&!sv.genderPrefEnabled)n=4;}
  if(SB.linked&&(n===3||n===4)){
    // email and phone missing on the reservation: still show "Your Stay" (filled in) so they can add them
    const complete=SB.email&&SB.phone;
    if(n>SB.step){SB._preGuestStep=SB.step;n=complete?5:4;}else n=(n===4&&!complete&&SB.step>4)?4:(SB._preGuestStep||2);
  }
  SB.step=n;renderStep();window.scrollTo({top:0,behavior:'smooth'});
}

function renderDots(total){
  document.getElementById('stepDots').innerHTML=Array.from({length:total},(_,i)=>
    `<div class="step-dot ${i+1<=SB.step?'on':''}"></div>`).join('');
}

// Group ceremonies price per-person once the minimum group size is met;
// below that, specific flat prices per headcount (not a formula — these are
// Darlene's real negotiated small-group rates, so no interpolation).
function spaGroupPrice(s,n){
  if(!s.groupPricing||!n||n<1)return null;
  const gp=s.groupPricing;
  // Explicit per-headcount override (e.g. a special solo rate) always wins,
  // checked before the flat-fee/per-person formulas below.
  if(gp.belowMin&&gp.belowMin[n]!=null)return gp.belowMin[n];
  // Flat-fee model (e.g. Private Yoga/Fitness): one flat rate covers up to
  // flatFeeMax people, each guest beyond that adds perPersonUSD.
  if(gp.flatFee!=null)return gp.flatFee+Math.max(0,n-(gp.flatFeeMax||0))*(gp.perPersonUSD||0);
  if(n>=gp.minGroup)return gp.perPersonUSD*n;
  return null;
}

function renderStep(){
  const el=document.getElementById('mainContent');
  if(SB.step===1) return renderStep1_SessionType(el);
  if(SB.step===2) return renderStep2_Service(el);
  if(SB.step===2.5) return renderStep2b_GroupCount(el);
  if(SB.step===3) return renderStep3_GuestType(el);
  if(SB.step===4) return SB.guestType==='hotel' ? renderStep4_Hotel(el) : renderStep4_Offsite(el);
  if(SB.step===5) renderStep5_Preference(el);
  else if(SB.step===6) renderStep6_DateTime(el);
  else if(SB.step===7) renderStep7_Confirm(el);
  if(SB.linked&&SB.step>=5&&SB.step===Math.floor(SB.step)&&!document.getElementById('sbLinkedBar')){
    const bar=document.createElement('div');bar.id='sbLinkedBar';
    bar.style.cssText='margin:0 0 12px;padding:10px 14px;border-radius:12px;background:#eef7f6;color:#2d6a6a;font-size:13px';
    bar.innerHTML=`Booking for <b>${esc(SB.firstName+' '+SB.lastName)}</b> · Room <b>${esc(SB.roomNumber)}</b> · charged to your room <a href="#" onclick="event.preventDefault();sbNotMe()" style="color:#2d6a6a;margin-left:6px">Not you?</a>`;
    const back=el.querySelector('.btn-back');back?back.after(bar):el.prepend(bar);
  }
}

// ── STEP 1 — ONE-ON-ONE OR GROUP CEREMONY ────────────────────────────────
function renderStep1_SessionType(el){
  if(SB_OFFER){const o=SpaData.services.filter(s=>s.active&&sbOfferFilter(s));if(o.length){SB.sessionType=(o[0].sessionType||'individual');SB.step=2;return renderStep2_Service(el);}}
  renderDots(7);
  el.innerHTML=`<div class="card">
    <div class="section-title">What Would You Like to Book?</div>
    <div class="section-sub">Choose the kind of experience you're looking for.</div>
    <div class="choice-btn" onclick="sbPickSessionType('individual')">One-on-One Treatment<div class="cd">Massage, bodywork, private classes and readings — just for you</div></div>
    <div class="choice-btn" onclick="sbPickSessionType('group')">Group Ceremony<div class="cd">Temazcal, Cacao &amp; Sound Healing, and other shared experiences</div></div>
  </div>`;
}
function sbPickSessionType(t){SB.sessionType=t;setStep(2);}

// ── STEP 2 — SERVICE ─────────────────────────────────────────────────────
function renderStep2_Service(el){
  renderDots(7);
  const active=SpaData.services.filter(s=>s.active && s.duration!=null && (s.groupPricing?true:s.price!=null) && (s.sessionType||'individual')===SB.sessionType && sbOfferFilter(s));
  let html=`${SB_OFFER?'':'<button class="btn-back" onclick="setStep(1)">&#8249; Back</button>'}<div class="card"><div class="section-title">Choose a Treatment</div><div class="section-sub">Select the service you'd like to book.</div>`;
  if(!active.length){
    html+=`<div class="no-slots">Nothing here is ready to book yet — please check back soon or contact us directly.</div>`;
  }
  // Sections: Body Work, Spirit Work and one combined "Body Movement and Yoga" (fitness, yoga, pilates, dance). Spirit Work and
  // Body Movement and Yoga are collapsible; Body Movement and Yoga starts closed.
  const svcCard=s=>{
    const priceLbl=s.groupPricing?('from $'+spaGroupPrice(s,s.groupPricing.minGuests||1)+' USD'):('$'+s.price+' USD');
    return `<div class="svc-card" onclick="sbPickService('${s.id}')">
        <div class="svc-name">${esc(s.name)}</div>
        ${s.description?`<div class="svc-desc">${esc(s.description)}</div>`:''}
        <div class="svc-meta"><span>${s.duration} min</span><span class="svc-price">${priceLbl}</span></div>
      </div>`;
  };
  const SECTIONS=[
    {label:'Body Work',cats:['massage'],collapsible:false},
    {label:'Spirit Work',cats:['spirit'],collapsible:true,open:true},
    {label:'Body Movement and Yoga',cats:['fitness','yoga','pilates','dance'],collapsible:true,open:false},
  ];
  SECTIONS.forEach(sec=>{
    const list=active.filter(s=>sec.cats.includes(s.category)).sort((a,b)=>sec.cats.indexOf(a.category)-sec.cats.indexOf(b.category));
    if(!list.length) return;
    if(!sec.collapsible){html+=`<div class="cat-label">${sec.label}</div>`+list.map(svcCard).join('');return;}
    html+=`<details class="cat-fold"${sec.open?' open':''}><summary class="cat-label cat-sum">${sec.label}</summary>${list.map(svcCard).join('')}</details>`;
  });
  html+=`</div>`;
  el.innerHTML=html;
}
function sbPickService(id){
  SB.serviceId=id;
  const svc=SpaData.services.find(s=>s.id===id);
  if(svc&&svc.groupPricing){SB.guestCount=SB.guestCount||svc.groupPricing.minGroup;SB.step=2.5;renderStep();return;}
  setStep(3);
}

// ── STEP 2b — GROUP SIZE (group ceremonies only) ─────────────────────────
function renderStep2b_GroupCount(el){
  renderDots(7);
  const svc=SpaData.services.find(s=>s.id===SB.serviceId);
  const gp=svc.groupPricing;
  const minGuests=gp.minGuests||1;
  const n=SB.guestCount||gp.minGroup;
  const price=spaGroupPrice(svc,n);
  const showWarn=gp.discourageSolo&&n>=minGuests&&n<=2;
  const belowMinGuests=n<minGuests;
  el.innerHTML=`<button class="btn-back" onclick="setStep(2)">&#8249; Back</button>
    <div class="card">
      <div class="section-title">${esc(svc.name)}</div>
      <div class="section-sub">How many guests will be joining? (${gp.minGroup}+ gets the group rate of $${gp.perPersonUSD}/person)</div>
      <div class="form-group"><label class="form-label">Number of Guests *</label><input class="form-input" type="number" min="${minGuests}" id="sbGuestCountInput" value="${n}" oninput="sbUpdateGroupCount(this.value)"></div>
      <div style="font-size:17px;font-weight:700;color:#2d6a6a;margin:16px 0">${price!=null?'Total: $'+price+' USD':(belowMinGuests?'':'That group size isn\'t priced yet — please contact us directly.')}</div>
      ${belowMinGuests?`<div class="no-slots">We don't offer this as a one-on-one experience — minimum ${minGuests} guests.</div>`:''}
      ${showWarn?`<div class="no-slots" style="color:#92400e;background:#fffbeb;border-color:#fde68a">We don't usually recommend booking this for 1–2 people unless you're a couple wanting a private experience — reach out to us to find out when we're hosting a group ${esc(svc.name)} you can join instead.</div>`:''}
      <button class="btn-primary" onclick="sbConfirmGroupCount()" ${price==null?'disabled':''}>Continue</button>
    </div>`;
}
function sbUpdateGroupCount(v){SB.guestCount=parseInt(v)||1;renderStep2b_GroupCount(document.getElementById('mainContent'));}
function sbConfirmGroupCount(){
  const svc=SpaData.services.find(s=>s.id===SB.serviceId);
  SB.groupTotalPrice=spaGroupPrice(svc,SB.guestCount);
  setStep(3);
}

// ── STEP 3 — GUEST TYPE ──────────────────────────────────────────────────
function renderStep3_GuestType(el){
  renderDots(7);
  el.innerHTML=`
    <button class="btn-back" onclick="setStep(2)">&#8249; Back</button>
    <div class="card">
      <div class="section-title">Are you staying at Amansala?</div>
      <div class="section-sub">This helps us arrange payment for your treatment.</div>

// staff-confirm-portal.js) the same way scSpaItemsForName does there: by
// full name, or by first name alone when no last name is on file.
function sbTherapistAvailAccount(ther){
  if(!ther)return null;
  const full=((ther.firstName||'')+' '+(ther.lastName||'')).trim().toLowerCase();
  const first=(ther.firstName||'').trim().toLowerCase();

// Mirrors scIsAvailable() in modules/staff-confirm-portal.js — this
// standalone guest-facing page can't load that module (it depends on
// booking-hub-only globals like bbcSchedules/actOpsData), so the same
// day-of-week-rule + specific-date matching logic is duplicated here.
// Keep both in sync if the availability data shape ever changes.
function sbIsTherapistAvailable(ther,date,period){
  const acct=sbTherapistAvailAccount(ther);
  if(!acct)return true;
  const dateBlocks=(acct.unavailableDates||[]).map(d=>typeof d==='string'?{date:d,period:'ALL'}:d);
  if(dateBlocks.some(b=>b.date===date&&(b.period==='ALL'||!period||b.period===period)))return false;
  const rules=acct.dayOfWeekRules||[];
  const covering=rules.filter(r=>date>=r.start&&(!r.end||date<=r.end));
  if(covering.length){
    const dow=new Date(date+'T12:00:00').getDay();
    const blockHit=covering.find(r=>r.mode==='block'&&r.days.includes(dow)&&(!r.period||r.period==='ALL'||!period||r.period===period));
    if(blockHit)return false;
    const onlyRules=covering.filter(r=>r.mode!=='block');
    if(onlyRules.length){
      const matchingDayRule=onlyRules.find(r=>r.days.includes(dow));
      if(!matchingDayRule)return false;
      if(matchingDayRule.period&&matchingDayRule.period!=='ALL'&&period&&matchingDayRule.period!==period)return false;
    }
  }
  return true;
}
// Darlene's spec 2026-10-15 (automatic therapist assignment): breaks/daily caps are no
// longer one flat "X minutes after every service" number for everyone — Maria Luisa has
// her own staged pattern (2 services, 45-min break, 2 more, hard cap 4 for AUTOMATIC
// bookings only — staff can still go over 4 by hand in the admin calendar, which uses its
// own separate soft-warning check in modules/spa-therapist-rules.js, untouched by this).
// Everyone else: a 30-min break after every 3 CONSECUTIVE (back-to-back, no gap) services,
// capped at 7/day. An explicit per-therapist override (ther.breakMinutes/maxServicesPerDay,
// settable on their profile) still wins over these defaults when staff has set one.
function sbSlotFree(therapistId,roomId,dateStr,startMin,duration,excludeApptId){
  const endMin=startMin+duration;
  let brk=0;
  if(therapistId){
    if(SB_BLOCKS.some(b=>b.therapistId===therapistId&&b.date===dateStr&&(b.allDay||(hhmmToMin(b.start)<endMin&&hhmmToMin(b.end)>startMin))))return false;
    const ther=SpaData.therapists.find(t=>t.id===therapistId);
    if(ther&&!sbIsTherapistAvailable(ther,dateStr,startMin<720?'AM':'PM'))return false;
    if(ther){
      const todaysSorted=SpaAppointments.filter(a=>a.id!==excludeApptId&&a.date===dateStr&&a.status!=='CANCELLED'&&a.therapistId===therapistId).sort((a,b)=>hhmmToMin(a.start)-hhmmToMin(b.start));
      // Maria's record is first name "Maria" + last name "Luisa" while the Auto-Assign setting says "Maria Luisa", so match the full name as well (before, her own rule never applied here)
      if((ther.firstName||'').trim()===SB_ROT.mariaName||`${(ther.firstName||'').trim()} ${(ther.lastName||'').trim()}`.trim()===SB_ROT.mariaName){
        if(todaysSorted.length>=SB_ROT.mariaDailyCap)return false;
        if(todaysSorted.length===SB_ROT.mariaStageSize){
          const last=todaysSorted[todaysSorted.length-1];
          if(startMin<hhmmToMin(last.start)+(last.duration||60)+SB_ROT.mariaBreakMinutes)return false;
        }
      }else{
        const cap=parseInt(ther.maxServicesPerDay,10)||SB_ROT.generalDailyCap;
        if(todaysSorted.length>=cap)return false;
        // Walk backward from the candidate slot: how many of today's services chain
        // back-to-back (no gap) right up to this new one? 3+ in a row needs a break first.
        let consecutive=0,cursorEnd=startMin;
        for(let i=todaysSorted.length-1;i>=0;i--){
          const aStart=hhmmToMin(todaysSorted[i].start),aEnd=aStart+(todaysSorted[i].duration||60);
          if(aEnd===cursorEnd){consecutive++;cursorEnd=aStart;}else break;
        }
        const explicitBreak=Math.max(0,parseInt(ther.breakMinutes,10)||0);
        brk=explicitBreak||(consecutive>=SB_ROT.generalBreakAfter?SB_ROT.generalBreakMinutes:0);
      }
    }
  }
  return !SpaAppointments.some(a=>{
    if(excludeApptId&&a.id===excludeApptId) return false;
    if(a.date!==dateStr||a.status==='CANCELLED') return false;
    const sameTher=a.therapistId===therapistId;
    const sameRoom=roomId&&a.roomId===roomId;
    if(!sameTher&&!sameRoom) return false;
    const aStart=hhmmToMin(a.start), aEnd=aStart+(a.duration||60);
    const pad=sameTher?brk:0;   // the break sits after whichever service comes first
    return startMin<aEnd+pad && endMin+pad>aStart;
  });
}
// Simple stand-in for the fair-rotation queue (full claim/accept flow is a
// later phase): among eligible+free therapists, prefer whoever has fewest
// upcoming appointments, so bookings don't pile onto the first name in the list.
function sbAutoAssign(candidates,dateStr,startMin,duration){
  const free=candidates.filter(t=>sbSlotFree(t.id,null,dateStr,startMin,duration));
  if(!free.length) return null;
  const svc=SpaData.services.find(s=>s.id===SB.serviceId);
  const freeRoom=svc.roomRequired ? SpaData.rooms.find(r=>!SpaAppointments.some(a=>a.date===dateStr&&a.roomId===r.id&&a.status!=='CANCELLED'&&startMin<hhmmToMin(a.start)+(a.duration||60)&&(startMin+duration)>hhmmToMin(a.start))) : null;
  if(svc.roomRequired && !freeRoom) return null;
  const counts=free.map(t=>({t,n:SpaAppointments.filter(a=>a.therapistId===t.id&&a.status!=='CANCELLED').length}));
  counts.sort((a,b)=>a.n-b.n);
  return {therapist:counts[0].t, room:freeRoom};
}
// Every eligible+free therapist at this exact time — not just the least-busy
// one — so the guest can pick who they want instead of us silently deciding.
function sbAllFreeAssignments(candidates,dateStr,startMin,duration){
  const free=candidates.filter(t=>sbSlotFree(t.id,null,dateStr,startMin,duration));
  if(!free.length) return [];
  const svc=SpaData.services.find(s=>s.id===SB.serviceId);
  if(!svc.roomRequired) return free.map(t=>({therapist:t,room:null}));
  const freeRooms=SpaData.rooms.filter(r=>!SpaAppointments.some(a=>a.date===dateStr&&a.roomId===r.id&&a.status!=='CANCELLED'&&startMin<hhmmToMin(a.start)+(a.duration||60)&&(startMin+duration)>hhmmToMin(a.start)));
  if(!freeRooms.length) return [];
  // Many rooms are one specific therapist's own dedicated space (Therapists
  // tab defaultRoomId — e.g. "Chica Rooftop - Gaby"), not an interchangeable
  // pool. Pairing free therapists with free rooms by array position ignored
  // that, so a therapist could land in a colleague's named room whenever the
  // two lists happened to line up that way (real report 2026-09-18: "book
  // Gaby, she lands with Eva in the rooms section"). Give each therapist
  // their own dedicated room first when it's free; only therapists with no
  // dedicated room (or whose room is taken) fall back to whatever's left.
  // Rooms that belong to SOME therapist (not necessarily one of today's
  // free candidates) — a therapist with no dedicated room of her own
  // shouldn't casually land in a colleague's named room just because it
  // happened to be free; that reads as a mix-up on the Room view (real
  // report 2026-09-19: Laura's booking showed up in "Chica Rooftop -
  // Julian"). Only borrow one as a last resort when nothing else is free.
  const dedicatedRoomIds=new Set(SpaData.therapists.map(t=>t.defaultRoomId).filter(Boolean));
  const usedRoomIds=new Set();
  const out=[];
  free.forEach(t=>{
    const home=t.defaultRoomId&&freeRooms.find(r=>r.id===t.defaultRoomId);
    if(home){out.push({therapist:t,room:home});usedRoomIds.add(home.id);}
  });
  free.forEach(t=>{
    if(out.some(o=>o.therapist.id===t.id))return;
    const room=freeRooms.find(r=>!usedRoomIds.has(r.id)&&!dedicatedRoomIds.has(r.id))
      ||freeRooms.find(r=>!usedRoomIds.has(r.id));
    if(room){out.push({therapist:t,room});usedRoomIds.add(room.id);}
  });
  return out;
}
function sbNextDays(n){

// Clamps the bookable date range to the guest's actual stay (SB.stayStart/
// stayEnd, looked up in sbSubmitHotel) — a guest who hasn't checked in yet
// can still book ahead, but only for dates within their real stay window,
// not today just because today happens to fall in the next-14-days list.
function sbBookableDays(){
  const today=new Date(sbTulumNow().dateStr+'T00:00:00');
  let start=today, end=new Date(today.getTime()+13*86400000);
  if(SB.stayStart){const ss=new Date(SB.stayStart+'T00:00:00');if(ss>start)start=ss;}
  if(SB.stayEnd){const se=new Date(SB.stayEnd+'T00:00:00');if(se<end)end=se;}
  const out=[];
  for(let d=new Date(start);d<=end;d=new Date(d.getTime()+86400000))out.push(new Date(d));
  return out;
}

// Darlene's spec 2026-10-15 (automatic therapist assignment): named priority order
// instead of plain "whoever's least busy". Rotation position is derived purely from
// TODAY's already-placed auto-assignments (appt.rotationGroup, set only by this same
// function — a staff-manual or "specific therapist" booking never counts toward it).
// "No gender preference" tries the male rotation first (Julian, then Miguel), per
// Jorge's confirmation 2026-10-15, falling through to the female rotation (and then
// the generic least-busy fallback) only if nobody from it is actually free right now
// — the "never leave a booking unfilled" safeguard.
function sbRotationOrder(){
  const apptsToday=SpaAppointments.filter(a=>a.date===SB.date&&a.status!=='CANCELLED');
  const maleBlock=()=>{
    const julianToday=apptsToday.filter(a=>a.rotationGroup==='male'&&a.rotationName===SB_ROT.malePrimary).length;
    const totalMale=apptsToday.filter(a=>a.rotationGroup==='male').length;
    if(julianToday<SB_ROT.malePrimaryCap) return [{name:SB_ROT.malePrimary,group:'male'},{name:SB_ROT.maleSecondary,group:'male'}];
    const alt=totalMale-julianToday;
    return [{name:alt%2===0?SB_ROT.maleSecondary:SB_ROT.malePrimary,group:'male'},{name:alt%2===0?SB_ROT.malePrimary:SB_ROT.maleSecondary,group:'male'}];
  };
  const femaleBlock=()=>{
    const totalFemale=apptsToday.filter(a=>a.rotationGroup==='female').length;
    const pattern=SB_ROT.femaleOrder;
    const primary=pattern[totalFemale%pattern.length];
    const rest=pattern.filter(n=>n!==primary);
    const out=[primary,...rest].map(n=>({name:n,group:'female'}));
    out.push({name:SB_ROT.femaleFallback,group:'female'});
    return out;
  };
  if(SB.prefType==='female') return femaleBlock();
  if(SB.prefType==='male') return maleBlock();
  // "No preference": try whichever rotation is configured first, then fall through to
  // the other (the "never leave a booking unfilled" safeguard).
  return SB_ROT.noPreferenceFirst==='female' ? [...femaleBlock(),...maleBlock()] : [...maleBlock(),...femaleBlock()];
}
function sbPickAutoSlot(startMin){
  const svc=SpaData.services.find(s=>s.id===SB.serviceId);
  const candidates=sbCandidateTherapists();
  if(sbTooSoon(SB.date,startMin)){alert(SB_WALKIN_MSG);sbRenderSlots(candidates,svc);return;}
  const assigns=sbAllFreeAssignments(candidates,SB.date,startMin,svc.duration);   // re-checked now, in case someone just booked it
  if(!assigns.length){alert('Sorry, that time was just taken. Please choose another time.');sbRenderSlots(candidates,svc);return;}
  let picked=null,pickedGroup=null;
  for(const r of sbRotationOrder()){
    const hit=assigns.find(a=>(a.therapist.firstName||'').trim()===r.name);
    if(hit){picked=hit;pickedGroup=r.group;break;}
  }
  if(!picked){
    // Nobody from either named rotation is free/qualified for this slot (e.g. only a
    // specialist like Eva qualifies) — fall back to the old least-busy-first logic
    // rather than leaving the booking unfilled.
    const d0=new Date(SB.date+'T12:00:00'),dow=(d0.getDay()+6)%7;
    const wkStart=new Date(d0.getTime()-dow*86400000).toISOString().slice(0,10),wkEnd=new Date(d0.getTime()+(6-dow)*86400000).toISOString().slice(0,10);
    const live=t=>SpaAppointments.filter(a=>a.therapistId===t.id&&a.status!=='CANCELLED');
    const dayN=t=>live(t).filter(a=>a.date===SB.date).length;
    const weekN=t=>live(t).filter(a=>a.date>=wkStart&&a.date<=wkEnd).length;
    const sorted=[...assigns].sort((a,b)=>dayN(a.therapist)-dayN(b.therapist)||weekN(a.therapist)-weekN(b.therapist)||live(a.therapist).length-live(b.therapist).length||String(a.therapist.firstName).localeCompare(String(b.therapist.firstName)));
    picked=sorted[0];pickedGroup=null;
  }
  SB.rotationGroup=pickedGroup;
  SB.rotationName=pickedGroup?(picked.therapist.firstName||'').trim():null;
  sbPickSlot(startMin,picked.therapist.id,picked.room?picked.room.id:'');
}
function sbPickSlot(startMin,therapistId,roomId){
  if(sbTooSoon(SB.date,startMin)){alert(SB_WALKIN_MSG);renderStep6_DateTime(document.getElementById('mainContent'));return;}
  SB.start=minToHHMM(startMin);
  SB.therapistId=therapistId;
  SB.roomId=roomId||null;
  setStep(7);
}

// Confirmation / cancellation emails are sent by netlify/functions/spa-public.js.
function sbMeet(appt){return typeof sbfMeet==='function'?sbfMeet(appt):{where:'',text:''};}   // where to meet — defined in modules/spa-booking-flow.js
// Offsite (day-spa) guests now pay BEFORE the appointment is written —
// Jorge's ask 2026-10-05, see create-spa-payment.js. Hotel guests are
// unaffected: sbFinalConfirm() routes straight to sbWriteAppointment(null),
// same behavior as before (auto-charged to the room folio once written).
let _sbPayInitiated=false,_sbStripe=null,_sbStripeElems=null,_sbPayAmount=0,_sbConfirmedPaymentIntentId=null;
async function sbFinalConfirm(){
  // Edge case: payment already succeeded and was verified, but writing the
  // appointment itself then failed (e.g. a network blip) -- retry the write
  // alone with the already-confirmed paymentIntentId, never re-run Stripe
  // payment on an already-captured PaymentIntent.
  if(_sbConfirmedPaymentIntentId)return sbWriteAppointment(_sbConfirmedPaymentIntentId);
  if(SB.guestType!=='hotel')return sbHandleOffsitePayment();
  return sbWriteAppointment(null);
}
async function sbHandleOffsitePayment(){
  const btn=document.getElementById('sbConfirmBtn');
  const errEl=document.getElementById('sbPayErr');
  errEl.textContent='';
  const svc=SpaData.services.find(s=>s.id===SB.serviceId);
  // Just for the button label while loading -- the real, authoritative
  // total (service price computed server-side from the catalog + this tip)
  // comes back from create-spa-payment.js as `data.amount`.
  const estPrice=(svc.groupPricing?SB.groupTotalPrice:svc.price)+(SB.tipAmount||0);

  if(!_sbPayInitiated){
    btn.disabled=true;btn.textContent='Loading…';
    try{
      const res=await fetch('/.netlify/functions/create-spa-payment',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({serviceId:SB.serviceId,guestCount:svc.groupPricing?SB.guestCount:undefined,tipAmount:SB.tipAmount||0,email:SB.email,firstName:SB.firstName,lastName:SB.lastName}),
      });
      const data=await res.json();
      if(!res.ok||data.error)throw new Error(data.error??'Could not start payment');
      _sbStripe=Stripe(data.publishableKey);
      _sbStripeElems=_sbStripe.elements({clientSecret:data.clientSecret,appearance:{theme:'stripe',variables:{fontFamily:"'DM Sans',sans-serif",borderRadius:'10px',colorPrimary:'#3AB7AE'}}});
      const payEl=_sbStripeElems.create('payment');
      const container=document.getElementById('sbStripeContainer');
      if(container)container.style.display='block';
      payEl.mount('#sbStripeElement');
      _sbPayAmount=Number(data.amount??estPrice);
      btn.textContent=`Pay $${_sbPayAmount.toFixed(2)} and Reserve`;
      btn.disabled=false;
      _sbPayInitiated=true;
      SB.paymentIntentId=data.paymentIntentId;
    }catch(e){
      errEl.textContent=e.message;
      btn.disabled=false;btn.textContent='Reserve — Payment Required';
    }
    return;
  }

  btn.disabled=true;btn.textContent='Processing…';
  try{
    const{error,paymentIntent}=await _sbStripe.confirmPayment({elements:_sbStripeElems,redirect:'if_required'});
    if(error){
      errEl.textContent=error.message;
      btn.disabled=false;btn.textContent=`Pay $${_sbPayAmount.toFixed(2)} and Reserve`;
      return;
    }
    const vres=await fetch('/.netlify/functions/confirm-spa-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentIntentId:paymentIntent.id})});
    const vdata=await vres.json();
    if(!vres.ok||vdata.error)throw new Error(vdata.error??'Could not verify payment');
    _sbConfirmedPaymentIntentId=paymentIntent.id;
    await sbWriteAppointment(paymentIntent.id);
  }catch(e){
    errEl.textContent=e.message;
    btn.disabled=false;btn.textContent=`Pay $${_sbPayAmount.toFixed(2)} and Reserve`;
  }
}
async function sbWriteAppointment(paymentIntentId){
  const btn=document.getElementById('sbConfirmBtn');
  const isHotel=SB.guestType==='hotel';
  btn.disabled=true;btn.textContent='Confirming…';
  try{
    // the server re-checks the slot and the stay, charges the folio at the catalog price (or checks the payment), saves and emails
    const d=await spaApi({action:'book',serviceId:SB.serviceId,guestCount:SB.guestCount,date:SB.date,start:SB.start,therapistId:SB.therapistId,roomId:SB.roomId||null,
      prefType:SB.prefType,rotationGroup:SB.rotationGroup||null,rotationName:SB.rotationName||null,guestType:SB.guestType,firstName:SB.firstName,lastName:SB.lastName,
      email:SB.email,phone:SB.phone,roomNumber:SB.roomNumber,tipAmount:SB.tipAmount||0,policyAcceptedAt:SB.policyAcceptedAt||null,policyVersion:SB.policyVersion||null,
      paymentIntentId:paymentIntentId||null});
    if(d.conflict){
      // The slot was taken in the time it took to pay — the server refunded it straight away
      showToast(paymentIntentId?(d.refunded?'That time was just booked by someone else — you have NOT been charged (refunded automatically). Please pick another time.':'That time was just booked by someone else. Our team will refund your payment — please pick another time.'):'That time was just booked by someone else — please pick another.');
      btn.disabled=false;btn.textContent=isHotel?'Confirm Booking':'Reserve — Payment Required';
      _sbPayInitiated=false;_sbStripe=null;_sbStripeElems=null;_sbConfirmedPaymentIntentId=null;
      try{const r=await fetch(SPA_FN+'?action=init');const i=await r.json();SpaAppointments=i.busy||SpaAppointments;}catch(e){}
      setStep(6);
      return;
    }
    if(d.outsideStay){
      SB.stayStart=d.start;SB.stayEnd=d.end;
      showToast("That date is outside your stay — please pick a date you're actually here.");
      btn.disabled=false;btn.textContent='Confirm Booking';
      setStep(6);
      return;
    }
    if(!d.ok)throw new Error(d.error||'not saved');
    const appt=d.appt,folioPosted=!!d.folioPosted;
    SpaAppointments.push(appt);
    const svc=SpaData.services.find(s=>s.id===SB.serviceId);
    const el=document.getElementById('mainContent');
    document.getElementById('stepDots').style.display='none';
    const viewConfirmationLink=`<div style="margin-top:18px"><a href="spa-booking.html?confirmation=${appt.id}" style="color:#2d6a6a;font-weight:600;font-size:13.5px;text-decoration:underline">View or print your confirmation</a></div>`;
    if(isHotel){
      el.innerHTML=`<div class="msg">
        <div class="msg-icon">🌴</div>
        <div class="msg-title">You're Booked!</div>
        <div class="msg-sub">See you for your <b>${esc(svc.name)}</b> on ${fmtDateLong(SB.date)} at ${fmtT(SB.start)}.<br><br>${folioPosted?'The charge has been added to your room folio.':'The charge will appear on your room folio. Our team will confirm your reservation.'} We've sent the details — including your meeting location and a cancellation link — to ${esc(d.email||SB.email)}.${sbMeet(appt).text?`<br><br><b>Where to meet:</b> ${esc(sbMeet(appt).text)}`:''}${viewConfirmationLink}</div>
      </div>`;
    }else{
      el.innerHTML=`<div class="msg">
        <div class="msg-icon">🌴</div>
        <div class="msg-title">You're Booked!</div>
        <div class="msg-sub">Your <b>${esc(svc.name)}</b> is confirmed for ${fmtDateLong(SB.date)} at ${fmtT(SB.start)}. Payment received — see you then! We've sent the details — including your meeting location and a cancellation link — to ${esc(d.email||SB.email)}.${sbMeet(appt).text?`<br><br><b>Where to meet:</b> ${esc(sbMeet(appt).text)}`:''}${viewConfirmationLink}</div>
      </div>`;
    }
  }catch(e){
    showToast('Something went wrong — please try again.');
    btn.disabled=false;btn.textContent=isHotel?'Confirm Booking':(_sbPayInitiated?'Try Again':'Reserve — Payment Required');
  }
}

// ── GUEST-FACING CONFIRMATION PAGE (reached via ?confirmation=<apptId> —
// linked from the confirmation email and the inline post-booking screen) —
// a page the guest can revisit anytime to see their appointment details
// again, without having to dig up the original email. Read-only summary
// plus a way into the existing cancel flow, same 12-hour cutoff it enforces.
// appt.date/appt.start are Tulum wall-clock values — anchor them to Tulum's
// fixed UTC-5 offset (Quintana Roo has had no DST since Feb 2015) so the
// hours-left-to-cancel math is correct no matter what timezone the guest's
// or staff's own browser is in.
function sbApptDateTime(appt){return new Date(appt.date+'T'+appt.start+':00-05:00');}
function sbRenderConfirmationScreen(apptId){
  document.getElementById('stepDots').style.display='none';
  const el=document.getElementById('mainContent');
  const appt=SpaAppointments.find(a=>a.id===apptId);
  if(!appt){
    el.innerHTML=`<div class="msg"><div class="msg-icon">🤔</div><div class="msg-title">Appointment Not Found</div><div class="msg-sub">We couldn't find that appointment. Please contact us directly if you need to make a change.</div></div>`;
    return;
  }
  const svc=SpaData.services.find(s=>s.id===appt.serviceId);
  const ther=SpaData.therapists.find(t=>t.id===appt.therapistId);
  const room=SpaData.rooms.find(r=>r.id===appt.roomId);
  const meetAt=room?(room.location?`${room.name} — ${room.location}`:room.name):'Our spa reception';
  const therName=(ther&&(appt.therapistPreference||{}).type==='specific')?`${ther.firstName} ${ther.lastName||''}`.trim():(ther?'Assigned by our team':'To be assigned');
  const isCancelled=appt.status==='CANCELLED';
  const hoursLeft=(sbApptDateTime(appt)-new Date())/3600000;
  const canCancelOnline=!isCancelled&&hoursLeft>=12;
  el.innerHTML=`<div class="card">
    <div class="section-title">${isCancelled?'Cancelled Appointment':'Your Appointment'}</div>
    ${isCancelled?`<div class="section-sub" style="margin-bottom:14px">This appointment was cancelled${appt.cancelledAt?' on '+fmtDateLong(appt.cancelledAt.slice(0,10)):''}.</div>`:''}
    <div class="summary-row"><span class="lbl">Service</span><span class="val">${esc(svc?.name||'')}</span></div>
    <div class="summary-row"><span class="lbl">Date</span><span class="val">${fmtDateLong(appt.date)}</span></div>
    <div class="summary-row"><span class="lbl">Time</span><span class="val">${fmtT(appt.start)}</span></div>
    <div class="summary-row"><span class="lbl">Therapist</span><span class="val">${esc(therName)}</span></div>
    <div class="summary-row"><span class="lbl">Meet at</span><span class="val">${esc(sbMeet(appt).where||meetAt)}</span></div>
    ${!isCancelled&&sbMeet(appt).text?`<div class="section-sub" style="margin:10px 0 4px;color:#2d2520;font-weight:600">${esc(sbMeet(appt).text)}</div>`:''}
    ${appt.roomNumber?`<div class="summary-row"><span class="lbl">Your room</span><span class="val">${esc(appt.roomNumber)}</span></div>`:''}
    <div class="summary-row"><span class="lbl">Price</span><span class="val">$${svc?.groupPricing?appt.groupTotalPriceUSD:svc?.price} USD${appt.guestType!=='hotel'?' + 13% tax':''}</span></div>
    ${appt.tipAmount>0?`<div class="summary-row"><span class="lbl">Tip</span><span class="val">$${appt.tipAmount} USD</span></div>`:''}
    ${!isCancelled?`<div class="section-sub" style="margin-top:14px">${canCancelOnline?'You can cancel free of charge up to 12 hours before your appointment. Need a different time instead? Please contact us directly — our team handles all time changes personally.':"It's less than 12 hours away, so it can't be cancelled online — please contact us directly if you need to."}</div>`:''}
    ${canCancelOnline?`<button class="btn-primary" style="margin-top:16px;background:#b45309" onclick="location.href='spa-booking.html?cancel=${appt.id}'">Cancel My Appointment</button>`:''}
  </div>`;
}
// ── GUEST-FACING CANCELLATION (reached via ?cancel=<apptId> link in the
// confirmation email) — enforces the 12-hour cutoff, reverses the folio
// charge if one was auto-posted, and emails a cancellation confirmation. ──
function sbRenderCancelScreen(apptId){
  document.getElementById('stepDots').style.display='none';
  const el=document.getElementById('mainContent');
  const appt=SpaAppointments.find(a=>a.id===apptId);
  if(!appt){
    el.innerHTML=`<div class="msg"><div class="msg-icon">🤔</div><div class="msg-title">Appointment Not Found</div><div class="msg-sub">We couldn't find that appointment. Please contact us directly if you need to make a change.</div></div>`;
    return;
  }
  const svc=SpaData.services.find(s=>s.id===appt.serviceId);
  if(appt.status==='CANCELLED'){
    el.innerHTML=`<div class="msg"><div class="msg-icon">✓</div><div class="msg-title">Already Cancelled</div><div class="msg-sub">This appointment has already been cancelled — nothing further to do.</div></div>`;
    return;
  }
  const hoursLeft=(sbApptDateTime(appt)-new Date())/3600000;
  if(hoursLeft<12){
    el.innerHTML=`<div class="msg"><div class="msg-icon">⏰</div><div class="msg-title">Too Late to Cancel Online</div><div class="msg-sub">Your <b>${esc(svc?.name||'appointment')}</b> on ${fmtDateLong(appt.date)} at ${fmtT(appt.start)} is less than 12 hours away, so it can't be cancelled online. Please contact us directly at the front desk if you still need to cancel.</div></div>`;
    return;
  }
  el.innerHTML=`<div class="card">
    <div class="section-title">Cancel This Appointment?</div>
    <div class="summary-row"><span class="lbl">Service</span><span class="val">${esc(svc?.name||'')}</span></div>
    <div class="summary-row"><span class="lbl">Date</span><span class="val">${fmtDateLong(appt.date)}</span></div>
    <div class="summary-row"><span class="lbl">Time</span><span class="val">${fmtT(appt.start)}</span></div>
    <div class="section-sub" style="margin-top:14px">Cancelling is free since it's more than 12 hours out. ${appt.folioStatus==='POSTED'?'The charge on your room folio will be removed.':''}</div>
    <button class="btn-primary" style="background:#b45309" id="sbCancelBtn" onclick="sbDoCancel('${apptId}')">Yes, Cancel My Appointment</button>
  </div>`;
}
async function sbDoCancel(apptId){
  const btn=document.getElementById('sbCancelBtn');
  if(btn){btn.disabled=true;btn.textContent='Cancelling…';}
  try{
    // the server applies the 12-hour rule, removes the folio charge (and tip), saves and emails
    const d=await spaApi({action:'cancel',id:apptId});
    const reload=async()=>{try{const r=await fetch(SPA_FN+'?action=appt&id='+encodeURIComponent(apptId));const x=await r.json();SpaAppointments=x.appt?[x.appt]:[];}catch(e){}sbRenderCancelScreen(apptId);};
    if(d.reason==='not_found'){showToast('Appointment not found.');return;}
    if(d.reason==='already'){showToast('Already cancelled.');return reload();}
    if(d.reason==='too_late'){showToast('Too close to your appointment time to cancel online.');return reload();}
    if(!d.ok)throw new Error('not cancelled');
    const el=document.getElementById('mainContent');
    el.innerHTML=`<div class="msg"><div class="msg-icon">✓</div><div class="msg-title">Cancelled</div><div class="msg-sub">Your appointment has been cancelled${d.folioReversed?' and the charge removed from your folio':''}. We've sent you a confirmation email.</div></div>`;
  }catch(e){
    showToast('Something went wrong — please try again.');
    if(btn){btn.disabled=false;btn.textContent='Yes, Cancel My Appointment';}
  }
}
