<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amansala — Driver View</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Jost', sans-serif; background: #f0f4f8; min-height: 100vh; }

.header {
  background: #1a2332;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,.3);
}
.header-brand { color: #4db6ac; font-size: 18px; font-weight: 800; letter-spacing: 3px; }
.header-driver { color: #fff; font-size: 14px; font-weight: 700; }
.header-co { color: #4db6ac; font-size: 11px; font-weight: 600; letter-spacing: .5px; }

.filters {
  background: #fff;
  border-bottom: 1px solid #e5e7eb;
  padding: 12px 16px;
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.filter-btn {
  padding: 7px 14px;
  border-radius: 20px;
  border: 1.5px solid #e5e7eb;
  background: #fff;
  font-family: 'Jost', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  color: #374151;
  transition: all .15s;
}
.filter-btn.active {
  background: #1a2332;
  color: #fff;
  border-color: #1a2332;
}
.date-input {
  padding: 7px 10px;
  border: 1.5px solid #e5e7eb;
  border-radius: 8px;
  font-family: 'Jost', sans-serif;
  font-size: 13px;
  color: #374151;
  outline: none;
}

.body { padding: 16px; max-width: 960px; margin: 0 auto; }

.date-header {
  font-size: 13px;
  font-weight: 800;
  color: #374151;
  text-transform: uppercase;
  letter-spacing: .08em;
  padding: 4px 0 10px;
  margin-top: 8px;
}
.date-header.today { color: #0f766e; }

.pickup-group { margin-bottom: 14px; }
.group-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.pickup-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #fdf4ff;
  color: #7e22ce;
  font-size: 12px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 20px;
}
.eta-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #eff6ff;
  color: #1d4ed8;
  font-size: 12px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 20px;
}

.confirm-btn {
  border: none;
  padding: 5px 14px;
  border-radius: 20px;
  font-family: 'Jost', sans-serif;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all .15s;
}
.confirm-btn.pending { background: #f1f5f9; color: #6b7280; }
.confirm-btn.done    { background: #d1fae5; color: #065f46; }

.card {
  border-radius: 12px;
  border: 1px solid #e5e7eb;
  padding: 14px 16px;
  margin-bottom: 8px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
  transition: border-color .2s;
}
.card.confirmed { border-color: #6ee7b7; }
.card-icon { font-size: 22px; flex-shrink: 0; margin-top: 1px; }
.card-body { flex: 1; min-width: 0; }
.card-name { font-size: 15px; font-weight: 700; color: #111827; }
.card-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 5px; }
.card-time { font-size: 14px; font-weight: 700; color: #374151; }
.card-flight { font-size: 13px; color: #6b7280; }
.card-room { font-size: 12px; background: #f1f5f9; color: #374151; padding: 2px 8px; border-radius: 6px; font-weight: 600; }
.card-eta { font-size: 12px; color: #6b7280; }
.card-notes { font-size: 12px; color: #9ca3af; font-style: italic; margin-top: 4px; }
.card-retreat { font-size: 11px; color: #9ca3af; margin-top: 4px; }

.badge {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 20px;
}
.badge-arr    { background: #dbeafe; color: #1d4ed8; }
.badge-dep    { background: #fce7f3; color: #9d174d; }
.badge-cun    { background: #eff6ff; color: #2563eb; }
.badge-tqo    { background: #f0fdf4; color: #16a34a; }
.badge-ot     { background: #fef2f2; color: #dc2626; }
.badge-share  { background: #f0fdf4; color: #16a34a; }
.badge-conf   { background: #d1fae5; color: #065f46; }

.empty {
  text-align: center;
  padding: 60px 20px;
  color: #9ca3af;
}
.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-title { font-size: 15px; font-weight: 700; color: #374151; margin-bottom: 6px; }

.ot-section { margin-top: 16px; }
.ot-header {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #fef2f2;
  color: #dc2626;
  font-size: 12px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 20px;
  margin-bottom: 8px;
}

.stats-bar {
  background: #fff;
  border-bottom: 1px solid #e5e7eb;
  padding: 10px 16px;
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}
.stat { font-size: 12px; color: #6b7280; }
.stat strong { color: #111827; font-weight: 700; }
</style>
</head>
<body>

<div class="header">
  <div class="header-brand">AMANSALA</div>
  <div style="text-align:right">
    <div class="header-driver" id="hdr-driver">Driver View</div>
    <div class="header-co" id="hdr-co"></div>
  </div>
</div>

<div class="filters">
  <button class="filter-btn active" id="f-upcoming" onclick="setFilter('upcoming')">Upcoming</button>
  <button class="filter-btn" id="f-today" onclick="setFilter('today')">Today</button>
  <button class="filter-btn" id="f-tomorrow" onclick="setFilter('tomorrow')">Tomorrow</button>
  <input type="date" class="date-input" id="f-date" onchange="setFilter('date',this.value)" title="Pick a specific date">
</div>

<div class="stats-bar" id="stats-bar"></div>
<div class="body" id="main-body">
  <div class="empty"><div class="empty-icon">⏳</div><div class="empty-title">Loading…</div></div>
</div>

<script>
const SUPA_URL = 'https://vnttlpqkssihbmcynxvo.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZudHRscHFrc3NpaGJtY3lueHZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNjU1NjEsImV4cCI6MjEwMDg0MTU2MX0.ZCnXPWFLmH1ysDZJm_evEIapYhPZubzKZFLadKvqr6A';

const PASTEL = ['#eff6ff','#f0fdf4','#faf5ff','#fffbeb','#fdf2f8','#f0fdfa','#fff7ed','#f0f9ff'];
const TR_LEAD = { cancun: 240, tulum: 150 };
const TR_ETA  = { cancun: 90,  tulum: 45  };

// Parse URL param
const params = new URLSearchParams(location.search);
const CO = (params.get('co') || '').toLowerCase();

// Company config
const COMPANIES = {
  irving:  { name: 'Irving', label: 'TQO Arrivals · TQO Departures · CUN Departures' },
  salomon: { name: 'Salomón', label: 'CUN Arrivals' },
};

const co = COMPANIES[CO];
if (!co) {
  document.getElementById('main-body').innerHTML = `<div class="empty">
    <div class="empty-icon">🚫</div>
    <div class="empty-title">Link inválido</div>
    <div>Usa ?co=irving o ?co=salomon</div>
  </div>`;
} else {
  document.getElementById('hdr-driver').textContent = co.name;
  document.getElementById('hdr-co').textContent = co.label;
  loadData();
}

function matchesCo(airport, type) {
  if (CO === 'irving') {
    if (airport === 'tulum') return true;
    if (airport === 'cancun' && type === 'departure') return true;
    return false;
  }
  if (CO === 'salomon') {
    return airport === 'cancun' && type === 'arrival';
  }
  return false;
}

let _entries = [];
let _userGroupMap = new Map();
let _filter  = 'upcoming';
let _filterDate = '';

async function supa(path) {
  const r = await fetch(`${SUPA_URL}/rest/v1/${path}`, {
    headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}` }
  });
  return r.json();
}

async function supaUpdate(rowId, body) {
  return fetch(`${SUPA_URL}/rest/v1/transport?id=eq.${rowId}`, {
    method: 'PATCH',
    headers: {
      apikey: SUPA_KEY,
      Authorization: `Bearer ${SUPA_KEY}`,
      'Content-Type': 'application/json',
      Prefer: 'return=minimal',
    },
    body: JSON.stringify(body),
  });
}

async function loadData() {
  const [rows, bookings, regs, settingsData] = await Promise.all([
    supa('transport?select=id,booking_id,data,submitted_at'),
    supa('bookings?select=id,leader_name,retreat_name,start_date,end_date,status&status=neq.cancelled'),
    supa('registrations?select=booking_id,room,guests'),
    supa('settings?key=eq.transport_groups&select=value&limit=1'),
  ]);
  _userGroupMap = new Map(settingsData?.[0]?.value ?? []);

  const bkMap = {};
  (bookings || []).forEach(b => { bkMap[b.id] = b; });

  // Room lookup by name
  const roomLookup = {};
  (regs || []).forEach(r => {
    (r.guests || []).forEach(g => {
      if (g.name && r.booking_id) {
        roomLookup[`${r.booking_id}|${g.name.toLowerCase()}`] = r.room || '';
      }
    });
  });

  // Dedup: collapse same-guest duplicate submissions
  const dedupedRows = (() => {
    const map = new Map();
    for (const row of rows || []) {
      const d  = row.data || {};
      const em = (d.email || '').toLowerCase().trim();
      const fn = (d.firstName || '').toLowerCase().trim();
      const ln = (d.lastName  || '').toLowerCase().trim();
      const key = `${em || (fn + '_' + ln)}|${d.arrivalDate || ''}|${d.departureDate || ''}`;
      const cur = map.get(key);
      if (!cur) { map.set(key, row); continue; }
      const curHasBk = !!cur.booking_id;
      const rowHasBk = !!row.booking_id;
      if (rowHasBk && !curHasBk) map.set(key, row);
      else if (rowHasBk === curHasBk && row.id > cur.id) map.set(key, row);
    }
    return [...map.values()];
  })();

  _entries = [];
  for (const row of dedupedRows) {
    const d   = row.data || {};
    const bk  = bkMap[row.booking_id];
    const name = [d.firstName, d.lastName].filter(Boolean).join(' ');
    const room = roomLookup[`${row.booking_id}|${name.toLowerCase()}`] || '';
    const retreatLabel = bk ? [bk.retreat_name, bk.leader_name].filter(Boolean).join(' · ') : '';

    // Arrival
    if (d.arrivalDate && d.arrivalTime && !d.arrivalOT) {
      const ap = (d.arrivalAirport || '').toLowerCase();
      if (matchesCo(ap, 'arrival')) {
        const etaMins = TR_ETA[ap] ?? 90;
        _entries.push({
          rowId: row.id, rawData: d,
          confirmed: !!d.driver_confirmed,
          type: 'arrival', date: d.arrivalDate, time: d.arrivalTime,
          airport: ap, flight: d.flightNumber || '', name, room,
          eta: addMins(d.arrivalTime, etaMins),
          share: !!d.willingToShare, notes: d.notes || '',
          retreatLabel, ot: false,
        });
      }
    }
    // Arrival OT
    if (d.arrivalDate && d.arrivalOT) {
      const ap = (d.arrivalAirport || '').toLowerCase();
      if (matchesCo(ap, 'arrival')) {
        _entries.push({
          rowId: row.id, rawData: d,
          confirmed: !!d.driver_confirmed,
          type: 'arrival', date: d.arrivalDate, time: d.arrivalTime || '',
          airport: ap, flight: d.flightNumber || '', name, room,
          eta: null, share: false, notes: d.notes || '',
          retreatLabel, ot: true,
        });
      }
    }

    // Departure
    if (d.departureDate && d.departureTime && !d.departureOT) {
      const ap = (d.departureAirport || '').toLowerCase();
      if (matchesCo(ap, 'departure')) {
        const leadMins = TR_LEAD[ap] ?? 240;
        _entries.push({
          rowId: row.id, rawData: d,
          confirmed: !!d.driver_confirmed,
          type: 'departure', date: d.departureDate, time: d.departureTime,
          airport: ap, flight: d.flightNumber || '', name, room,
          pickup: addMins(d.departureTime, -leadMins),
          share: !!d.willingToShare, notes: d.notes || '',
          retreatLabel, ot: false,
        });
      }
    }
    // Departure OT
    if (d.departureDate && d.departureOT) {
      const ap = (d.departureAirport || '').toLowerCase();
      if (matchesCo(ap, 'departure')) {
        _entries.push({
          rowId: row.id, rawData: d,
          confirmed: !!d.driver_confirmed,
          type: 'departure', date: d.departureDate, time: d.departureTime || '',
          airport: ap, flight: d.flightNumber || '', name, room,
          pickup: null, share: false, notes: d.notes || '',
          retreatLabel, ot: true,
        });
      }
    }
  }

  render();
}

// Confirm / unconfirm a group of rowIds
async function confirmGroup(idsStr, confirmed) {
  const rowIds = idsStr.split(',').filter(Boolean);
  if (!rowIds.length) return;

  // 1. Update UI immediately (optimistic)
  rowIds.forEach(rowId => {
    _entries.forEach(e => { if (e.rowId === rowId) e.confirmed = confirmed; });
  });
  render();

  // 2. Persist to Supabase
  const failed = [];
  await Promise.all(rowIds.map(async rowId => {
    const entry = _entries.find(e => e.rowId === rowId);
    if (!entry) return;
    const newData = { ...(entry.rawData || {}), driver_confirmed: confirmed };
    try {
      const resp = await supaUpdate(rowId, { data: newData });
      if (resp.ok || resp.status === 204) {
        entry.rawData = newData;
      } else {
        const txt = await resp.text().catch(() => '');
        console.error('Confirm failed:', resp.status, txt);
        failed.push(rowId);
      }
    } catch(err) {
      console.error('Confirm error:', err);
      failed.push(rowId);
    }
  }));

  // 3. Revert if all failed
  if (failed.length === rowIds.length) {
    rowIds.forEach(rowId => {
      _entries.forEach(e => { if (e.rowId === rowId) e.confirmed = !confirmed; });
    });
    render();
    alert('No se pudo guardar la confirmación. Verifica tu conexión.');
  }
}

function setFilter(f, val) {
  _filter = f;
  _filterDate = val || '';
  ['upcoming','today','tomorrow'].forEach(k => {
    document.getElementById('f-' + k)?.classList.toggle('active', k === f);
  });
  if (f !== 'date') document.getElementById('f-date').value = '';
  render();
}

function toMins(t) {
  if (!t) return null;
  const [h, m] = t.split(':').map(Number);
  return h * 60 + (m || 0);
}
function addMins(t, mins) {
  if (!t) return null;
  const total = ((toMins(t) + mins) % 1440 + 1440) % 1440;
  return String(Math.floor(total/60)).padStart(2,'0') + ':' + String(total%60).padStart(2,'0');
}
function fmtTime(t) {
  if (!t) return '—';
  const [h,m] = t.split(':').map(Number);
  return `${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`;
}
function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d + 'T12:00:00');
  return dt.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
}

function filterEntries() {
  const today    = new Date().toISOString().slice(0,10);
  const tomorrow = new Date(Date.now() + 86400000).toISOString().slice(0,10);
  return _entries.filter(e => {
    if (_filter === 'today')    return e.date === today;
    if (_filter === 'tomorrow') return e.date === tomorrow;
    if (_filter === 'date')     return e.date === _filterDate;
    return e.date >= today; // upcoming
  });
}

// Greedy 20-min window → color map
function colorMap(entries) {
  const map = new Map();
  const clusters = [];
  const ugColors = new Map(); // ugKey → color
  let ci = 0;

  // First pass: user-defined groups get consistent colors
  for (const e of entries) {
    if (e.ot) continue;
    const ugKey = _userGroupMap.get(`${e.type}|${e.rowId}`);
    if (ugKey) {
      if (!ugColors.has(ugKey)) ugColors.set(ugKey, PASTEL[ci++ % PASTEL.length]);
      map.set(e, ugColors.get(ugKey));
    }
  }

  // Second pass: auto 20-min window for the rest
  for (const e of entries) {
    if (e.ot || _userGroupMap.get(`${e.type}|${e.rowId}`)) continue;
    const sortT = e.type === 'departure' ? (e.pickup || e.time) : e.time;
    const mins = toMins(sortT);
    if (!e.date || mins === null) continue;
    const key = `${e.date}|${e.airport}|${e.type}`;
    let joined = false;
    for (const cl of clusters) {
      if (cl.key !== key) continue;
      if (cl.members.some(m => Math.abs(toMins(m.type==='departure'?(m.pickup||m.time):m.time) - mins) <= 20)) {
        cl.members.push(e); joined = true; break;
      }
    }
    if (!joined) clusters.push({ key, members: [e] });
  }
  clusters.forEach(cl => {
    const color = PASTEL[ci++ % PASTEL.length];
    cl.members.forEach(e => map.set(e, color));
  });
  return map;
}

// Earliest pickup in a time-cluster for departures (same airport only)
function buildPickupGroups(entries) {
  const groups = [];
  const ugAssigned = new Map();

  for (const e of entries) {
    const t = e.pickup || e.time;
    const ugKey = _userGroupMap.get(`${e.type}|${e.rowId}`);
    if (ugKey) {
      if (ugAssigned.has(ugKey)) {
        groups[ugAssigned.get(ugKey)].members.push(e);
      } else {
        ugAssigned.set(ugKey, groups.length);
        groups.push({ pickup: t, airport: e.airport, members: [e], userGroup: true });
      }
      continue;
    }
    let joined = false;
    for (const g of groups) {
      if (g.userGroup) continue;
      if (g.airport !== e.airport) continue;
      if (Math.abs(toMins(g.pickup) - toMins(t)) <= 20) { g.members.push(e); joined = true; break; }
    }
    if (!joined) groups.push({ pickup: t, airport: e.airport, members: [e] });
  }
  groups.forEach(g => {
    const minT = g.members.reduce((mn, e) => {
      const t = e.pickup || e.time;
      return toMins(t) < toMins(mn) ? t : mn;
    }, g.pickup);
    g.pickup = minT;
  });
  return groups;
}

function buildEtaGroups(entries) {
  const groups = [];
  const ugAssigned = new Map();

  for (const e of entries) {
    const ugKey = _userGroupMap.get(`${e.type}|${e.rowId}`);
    if (ugKey) {
      if (ugAssigned.has(ugKey)) {
        groups[ugAssigned.get(ugKey)].members.push(e);
      } else {
        ugAssigned.set(ugKey, groups.length);
        groups.push({ eta: e.eta || e.time, airport: e.airport, members: [e], userGroup: true });
      }
      continue;
    }
    const mins = toMins(e.eta || e.time);
    let joined = false;
    for (const g of groups) {
      if (g.userGroup) continue;
      if (g.airport !== e.airport) continue;
      if (Math.abs(toMins(g.eta) - mins) <= 20) { g.members.push(e); joined = true; break; }
    }
    if (!joined) groups.push({ eta: e.eta || e.time, airport: e.airport, members: [e] });
  }
  return groups;
}

function render() {
  const filtered = filterEntries().sort((a, b) => {
    if (a.date !== b.date) return a.date.localeCompare(b.date);
    const aT = a.type === 'departure' ? (a.pickup||a.time||'') : (a.time||'');
    const bT = b.type === 'departure' ? (b.pickup||b.time||'') : (b.time||'');
    return aT.localeCompare(bT);
  });

  const today = new Date().toISOString().slice(0,10);
  const normal = filtered.filter(e => !e.ot);
  const ot     = filtered.filter(e => e.ot);
  const cmap   = colorMap(normal);

  // Stats
  const arrCount = filtered.filter(e => e.type==='arrival').length;
  const depCount = filtered.filter(e => e.type==='departure').length;
  const confCount = filtered.filter(e => e.confirmed && !e.ot).length;
  document.getElementById('stats-bar').innerHTML = `
    <div class="stat">🛬 <strong>${arrCount}</strong> arrival${arrCount!==1?'s':''}</div>
    <div class="stat">🛫 <strong>${depCount}</strong> departure${depCount!==1?'s':''}</div>
    <div class="stat">Total <strong>${filtered.length}</strong> guests</div>
    ${confCount ? `<div class="stat" style="color:#065f46">✓ <strong>${confCount}</strong> confirmed</div>` : ''}
  `;

  if (!filtered.length) {
    document.getElementById('main-body').innerHTML = `<div class="empty">
      <div class="empty-icon">✈️</div>
      <div class="empty-title">No transfers</div>
      <div style="font-size:13px">No entries for the selected period</div>
    </div>`;
    return;
  }

  // Group by date
  const byDate = new Map();
  normal.forEach(e => {
    if (!byDate.has(e.date)) byDate.set(e.date, { arr:[], dep:[] });
    byDate.get(e.date)[e.type==='arrival'?'arr':'dep'].push(e);
  });

  const TH = (t, w='') => `<th style="padding:8px 10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#6b7280;text-align:left;white-space:nowrap;border-bottom:2px solid #e5e7eb;${w?'width:'+w:''}">${t}</th>`;

  let html = `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-family:'Jost',sans-serif">
  <thead><tr style="background:#f8fafc">
    ${TH('Hab.','70px')}${TH('Nombre')}${TH('Tipo','100px')}${TH('Aeropuerto','80px')}${TH('Vuelo')}${TH('Hora')}${TH('Notas')}${TH('Retiro')}
  </tr></thead><tbody>`;

  for (const [date, {arr, dep}] of byDate) {
    const isToday = date === today;
    html += `<tr><td colspan="8" style="padding:8px 10px;background:${isToday?'#ccfbf1':'#f1f5f9'};font-size:11px;font-weight:700;color:${isToday?'#0f766e':'#374151'};border-top:2px solid #e5e7eb">${isToday?'📍 TODAY — ':''}${fmtDate(date)}</td></tr>`;

    if (arr.length) {
      const etaGroups = buildEtaGroups(arr);
      etaGroups.forEach((g, gi) => {
        if (gi > 0) html += `<tr><td colspan="8" style="padding:6px;background:#fff;border:none"></td></tr>`;
        const idsStr  = g.members.map(e => e.rowId).join(',');
        const allDone = g.members.every(e => e.confirmed);
        const grpBg   = cmap.get(g.members[0]) || '#f9fafb';
        html += `<tr style="background:${grpBg}"><td colspan="8" style="padding:5px 10px">
          <div style="display:flex;align-items:center;gap:10px">
            <span class="eta-label">🛬 ETA hotel ~${fmtTime(g.eta)}</span>
            <span style="font-size:10px;font-weight:600;color:#6b7280">${g.members.length} pax</span>
            <button class="confirm-btn ${allDone?'done':'pending'}" onclick="confirmGroup('${idsStr}',${!allDone})">${allDone?'✓ Confirmado':'Confirmar ✓'}</button>
          </div></td></tr>`;
        g.members.forEach(e => { html += renderRow(e, cmap.get(e)); });
      });
    }

    if (dep.length) {
      if (arr.length) html += `<tr><td colspan="8" style="padding:8px;background:#fff;border:none"></td></tr>`;
      const pickupGroups = buildPickupGroups(dep);
      pickupGroups.forEach((g, gi) => {
        if (gi > 0) html += `<tr><td colspan="8" style="padding:6px;background:#fff;border:none"></td></tr>`;
        const idsStr  = g.members.map(e => e.rowId).join(',');
        const allDone = g.members.every(e => e.confirmed);
        const grpBg   = cmap.get(g.members[0]) || '#f9fafb';
        html += `<tr style="background:${grpBg}"><td colspan="8" style="padding:5px 10px">
          <div style="display:flex;align-items:center;gap:10px">
            <span class="pickup-label">🚐 Pick-up ${fmtTime(g.pickup)}</span>
            <span style="font-size:10px;font-weight:600;color:#6b7280">${g.members.length} pax</span>
            <button class="confirm-btn ${allDone?'done':'pending'}" onclick="confirmGroup('${idsStr}',${!allDone})">${allDone?'✓ Confirmado':'Confirmar ✓'}</button>
          </div></td></tr>`;
        g.members.forEach(e => { html += renderRow(e, cmap.get(e)); });
      });
    }
  }

  if (ot.length) {
    html += `<tr><td colspan="8" style="padding:8px 10px;background:#fef2f2;font-size:11px;font-weight:700;color:#dc2626;border-top:2px solid #e5e7eb">🚗 Own Transport (${ot.length})</td></tr>`;
    ot.forEach(e => { html += renderRow(e, null); });
  }

  html += `</tbody></table></div>`;
  document.getElementById('main-body').innerHTML = html;
}

function renderRow(e, color) {
  const isArr = e.type === 'arrival';
  const apBadge = e.airport === 'cancun'
    ? '<span class="badge badge-cun">CUN</span>'
    : e.airport === 'tulum'
      ? '<span class="badge badge-tqo">TQO</span>'
      : '';
  const typeBadge = isArr
    ? '<span class="badge badge-arr">🛬 Arrival</span>'
    : '<span class="badge badge-dep">🛫 Dep</span>';

  // Flight status badge — from monitor-flights (arrivals) or local fallback (arrivals + departures)
  const flightStatusBadge = (() => {
    if (!e.flight) return '';
    const today = new Date().toISOString().slice(0, 10);
    let lbl = isArr ? (e.rawData?.flightLabel ?? null) : null;
    if (!lbl) {
      if (e.date < today)  lbl = isArr ? 'LANDED'   : 'DEPARTED';
      else                 lbl = 'SCHEDULED';
    }
    const cancelled  = lbl === 'CANCELLED';
    const delayed    = lbl.startsWith('DELAYED');
    const early      = lbl.startsWith('EARLY');
    const past       = lbl === 'LANDED' || lbl === 'DEPARTED';
    const scheduled  = lbl === 'SCHEDULED';
    const bg = cancelled ? '#fef2f2' : delayed ? '#fff7ed' : early ? '#eff6ff' : (past || scheduled) ? '#f1f5f9' : '#f0fdf4';
    const cl = cancelled ? '#dc2626' : delayed ? '#c2410c' : early ? '#1d4ed8' : (past || scheduled) ? '#9ca3af' : '#15803d';
    return `<div style="margin-top:3px"><span style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:8px;background:${bg};color:${cl};white-space:nowrap">${lbl}</span></div>`;
  })();

  const timeCell = isArr
    ? (e.time ? `<strong>${fmtTime(e.time)}</strong>${e.eta ? `<span style="color:#9ca3af;font-size:11px"> → ~${fmtTime(e.eta)}</span>` : ''}` : '—')
    : (e.pickup ? `<span style="color:#7e22ce;font-weight:700">🚐 ${fmtTime(e.pickup)}</span>${e.time ? `<span style="color:#9ca3af;font-size:11px"> ✈ ${fmtTime(e.time)}</span>` : ''}` : (e.time ? fmtTime(e.time) : '—'));

  const namePart = `<div style="font-weight:700;color:#111827;font-size:13px">${esc(e.name)}</div>
    ${e.confirmed ? '<span class="badge badge-conf" style="font-size:9px">✓ Conf</span>' : ''}
    ${e.share ? '<span class="badge badge-share" style="font-size:9px">Shared</span>' : ''}`;

  const bg = color || '#fff';
  const TD = (content, s='') => `<td style="padding:8px 10px;font-size:12.5px;vertical-align:middle;border-bottom:1px solid rgba(0,0,0,.04);${s}">${content}</td>`;

  return `<tr style="background:${bg}">
    ${TD(e.room ? `<span style="font-weight:600;background:#f1f5f9;padding:2px 7px;border-radius:5px;font-size:11.5px">${esc(e.room)}</span>` : '<span style="color:#d1d5db">—</span>')}
    ${TD(namePart)}
    ${TD(typeBadge)}
    ${TD(apBadge, 'text-align:center')}
    ${TD((e.flight ? `<span style="font-weight:600">${esc(e.flight)}</span>` : '<span style="color:#d1d5db">—</span>') + flightStatusBadge)}
    ${TD(timeCell)}
    ${TD(e.notes ? `<span style="font-size:11px;color:#6b7280;font-style:italic">${esc(e.notes)}</span>` : '')}
    ${TD(e.retreatLabel ? `<span style="font-size:11px;color:#9ca3af">${esc(e.retreatLabel)}</span>` : '')}
  </tr>`;
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>

</html>
