<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guest Payment — Amansala</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Jost', sans-serif;
      background: #f8fafc;
      color: #111827;
      min-height: 100vh;
    }

    .header {
      background: linear-gradient(135deg, #0d9488 0%, #14b8a6 50%, #0891b2 100%);
      color: #fff;
      text-align: center;
      padding: 36px 20px 28px;
    }
    .header h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.3px; }
    .header p  { font-size: 14px; opacity: 0.85; margin-top: 5px; }

    .main {
      max-width: 560px;
      margin: 0 auto;
      padding: 28px 16px 60px;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid #f3f4f6;
    }
    .card-header h2 { font-size: 15px; font-weight: 700; color: #111827; }
    .card-header .subtitle { font-size: 12.5px; color: #6b7280; margin-top: 3px; }

    .card-body { padding: 0; }

    .items-table { width: 100%; border-collapse: collapse; }
    .items-table th {
      padding: 9px 20px;
      text-align: left;
      font-size: 10.5px;
      font-weight: 700;
      color: #6b7280;
      background: #f8fafc;
      border-bottom: 1px solid #e5e7eb;
    }
    .items-table th:last-child { text-align: right; }
    .items-table td {
      padding: 11px 20px;
      font-size: 13px;
      color: #374151;
      border-bottom: 1px solid #f9fafb;
    }
    .items-table td:last-child { text-align: right; font-weight: 600; color: #111827; }
    .items-table .total-row td {
      border-top: 2px solid #e5e7eb;
      border-bottom: none;
      font-weight: 700;
      font-size: 13.5px;
      color: #111827;
      background: #f8fafc;
    }
    .items-table .tax-row td { font-size: 12px; color: #6b7280; font-weight: 400; }
    .items-table .due-row td {
      border-top: 2px solid #0d9488;
      border-bottom: none;
      font-size: 15px;
      font-weight: 800;
      color: #0d9488;
      background: #f0fdfa;
    }

    .payment-section { padding: 20px; }
    .payment-label {
      font-size: 11.5px;
      font-weight: 700;
      color: #374151;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    #stripe-element {
      border: 1.5px solid #e5e7eb;
      border-radius: 9px;
      padding: 12px;
      background: #fff;
      min-height: 44px;
    }
    .stripe-lock {
      font-size: 11px;
      color: #9ca3af;
      text-align: center;
      margin-top: 8px;
    }

    .btn-pay {
      display: block;
      width: 100%;
      margin-top: 16px;
      background: #0d9488;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Jost', sans-serif;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-pay:hover:not(:disabled) { background: #0f766e; }
    .btn-pay:disabled { background: #9ca3af; cursor: not-allowed; }

    .btn-tip {
      display: block;
      width: 100%;
      background: #fff;
      color: #0d9488;
      border: 1.5px solid #0d9488;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      font-family: 'Jost', sans-serif;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-tip:hover { background: #f0fdfa; }

    .tip-form { padding: 16px 20px; }
    .tip-form label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      color: #374151;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .tip-form input, .tip-form select {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid #e5e7eb;
      border-radius: 9px;
      font-size: 14px;
      font-family: 'Jost', sans-serif;
      margin-bottom: 14px;
      background: #fff;
      color: #111827;
    }
    .tip-form .tip-btn-row { display: flex; gap: 10px; }
    .tip-form .tip-btn-row .btn-pay { margin-top: 0; }
    .tip-recipients {
      border: 1.5px solid #e5e7eb;
      border-radius: 9px;
      padding: 4px 12px;
      margin-bottom: 4px;
    }
    .tip-form .tip-recipient-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      margin-bottom: 0;
      border-bottom: 1px solid #f3f4f6;
      flex-wrap: wrap;
    }
    .tip-form .tip-recipient-row:last-child { border-bottom: none; }
    .tip-form .tip-recipient-row > label {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 140px;
      text-transform: none;
      font-weight: 500;
      font-size: 14px;
      color: #374151;
      letter-spacing: normal;
      cursor: pointer;
      margin-bottom: 0;
    }
    .tip-recipient-row input[type="checkbox"] { width: 16px; height: 16px; flex-shrink: 0; margin: 0; accent-color: #0d9488; }
    .tip-form .tip-recipient-row input.tip-recipient-name,
    .tip-form .tip-recipient-row input.tip-recipient-amount {
      width: 90px;
      flex: 0 0 auto;
      margin-bottom: 0;
      padding: 7px 8px;
    }
    .tip-form .tip-recipient-row input.tip-recipient-name { width: 120px; }
    .btn-tip-cancel {
      display: block;
      width: 100%;
      background: #fff;
      color: #6b7280;
      border: 1.5px solid #e5e7eb;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Jost', sans-serif;
      cursor: pointer;
    }
    .btn-tip-cancel:hover { background: #f9fafb; }

    .error-msg {
      color: #dc2626;
      font-size: 12.5px;
      margin-top: 10px;
      text-align: center;
      min-height: 20px;
    }

    .contact-note {
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
      margin-top: 20px;
      line-height: 1.6;
    }
    .contact-note a { color: #0d9488; text-decoration: none; }
    .contact-note a:hover { text-decoration: underline; }

    /* States */
    .state-loading, .state-error {
      text-align: center;
      padding: 60px 20px;
    }
    .state-loading { color: #9ca3af; font-size: 15px; }
    .state-error   { color: #dc2626; font-size: 14px; }
    .state-error h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }

    .success-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 48px 24px;
      text-align: center;
    }
    .success-icon { font-size: 52px; margin-bottom: 16px; }
    .success-card h2 { font-size: 20px; font-weight: 800; color: #111827; margin-bottom: 10px; }
    .success-card p  { font-size: 13.5px; color: #6b7280; line-height: 1.7; }
    .success-card strong { color: #0d9488; }

    @media (max-width: 480px) {
      .header h1 { font-size: 22px; }
      .items-table th, .items-table td { padding: 9px 14px; font-size: 12px; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>Amansala Tulum</h1>
  <p>Beach retreat &amp; wellness &middot; Tulum, Mexico</p>
</div>

<div class="main" id="main">
  <div class="state-loading">Loading your folio…</div>
</div>

<script>
// ─── STATE ───────────────────────────────────────────────────
let _folio   = null;
let _items   = [];
let _booking = null;
let _total   = 0;
let _stripe  = null;
let _stripeElems = null;
let _token   = null;

// ─── INIT ─────────────────────────────────────────────────────
(async function init() {
  const params = new URLSearchParams(location.search);
  const token  = params.get('token');
  if (!token) { showError('No payment token in URL.'); return; }
  _token = token;

  try {
    const res  = await fetch(`/.netlify/functions/get-folio?token=${encodeURIComponent(token)}`);
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error ?? 'Could not load folio');
    _folio   = data.folio;
    _items   = data.items  ?? [];
    _booking = data.booking;
    _total   = data.total  ?? 0;
    renderFolio(token);
  } catch (e) {
    showError(e.message);
  }
})();

// ─── RENDER ───────────────────────────────────────────────────
function renderFolio(token) {
  const main = document.getElementById('main');

  const guestName = _booking
    ? `${esc(_booking.first_name ?? '')} ${esc(_booking.last_name ?? '')}`.trim()
    : '';

  const roomLine = _booking
    ? [
        _booking.room_type_name,
        _booking.check_in && _booking.check_out ? `${fmtDate(_booking.check_in)} – ${fmtDate(_booking.check_out)}` : null,
        _booking.check_in && _booking.check_out
          ? `${Math.max(1, Math.round((new Date(_booking.check_out) - new Date(_booking.check_in)) / 86400000))} night${Math.round((new Date(_booking.check_out) - new Date(_booking.check_in)) / 86400000) !== 1 ? 's' : ''}`
          : null,
        _booking.adults != null ? `${_booking.adults} adult${_booking.adults !== 1 ? 's' : ''}` : null,
      ].filter(Boolean).join(' · ')
    : '';

  const subtotal = _items.reduce((s, i) => s + Number(i.qty) * Number(i.unit_price), 0);
  const taxAmt   = _items.reduce((s, i) => s + Number(i.qty) * Number(i.unit_price) * (Number(i.tax_rate) || 0) / 100, 0);
  const grandTotal = subtotal + taxAmt;
  const hasTax   = taxAmt > 0;

  const itemRows = _items.map(i => {
    const tax = Number(i.tax_rate) || 0;
    const lineBase  = Number(i.qty) * Number(i.unit_price);
    const lineTax   = lineBase * tax / 100;
    const lineTotal = (lineBase + lineTax).toFixed(2);
    return `<tr>
      <td>${esc(i.description ?? '')}</td>
      <td>${Number(i.qty)} × $${Number(i.unit_price).toFixed(2)}${tax > 0 ? ` <span style="font-size:11px;color:#6b7280">(+${tax}%)</span>` : ''}</td>
      <td>$${lineTotal}</td>
    </tr>`;
  }).join('');

  main.innerHTML = `
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:13px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">Guest Payment</div>
      <div style="font-size:18px;font-weight:800;color:#111827">${guestName || 'Guest'}</div>
      ${roomLine ? `<div style="font-size:12.5px;color:#6b7280;margin-top:4px">${roomLine}</div>` : ''}
      ${(_booking?.source === 'Escape' || _booking?.source === 'Extra Night' || _booking?.booking_type === 'room_only') ? `<div style="font-size:12.5px;color:#0d9488;margin-top:6px;font-weight:600">Your reservation included breakfast</div>` : ''}
    </div>

    <div class="card">
      <div class="card-header">
        <h2>${esc(_folio.name)}</h2>
        ${_folio.status === 'paid' ? '<div class="subtitle" style="color:#059669;font-weight:700">Paid</div>' : '<div class="subtitle">Open balance</div>'}
      </div>
      <div class="card-body">
        <table class="items-table">
          <thead><tr>
            <th>Description</th>
            <th>Qty × Price</th>
            <th>Total</th>
          </tr></thead>
          <tbody>${itemRows}</tbody>
          <tfoot>
            ${hasTax ? `<tr class="total-row"><td colspan="2">Subtotal</td><td>$${subtotal.toFixed(2)}</td></tr>` : ''}
            ${hasTax ? `<tr class="tax-row"><td colspan="2">Tax</td><td>$${taxAmt.toFixed(2)}</td></tr>` : ''}
            <tr class="due-row" id="due-row">
              <td colspan="2">Amount Due</td>
              <td id="due-amount">$${grandTotal.toFixed(2)}</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>

    ${_folio.status === 'paid'
      ? `<div class="card" style="padding:24px 20px;text-align:center;background:#f0fdf4;border-color:#86efac">
           <div style="font-size:24px;margin-bottom:8px">✅</div>
           <div style="font-size:14px;font-weight:700;color:#15803d">This folio has already been paid.</div>
           <div style="font-size:12.5px;color:#6b7280;margin-top:6px">Thank you! Questions? <a href="mailto:reservations@amansala.com" style="color:#0d9488">reservations@amansala.com</a></div>
         </div>`
      : `<div class="card" id="tip-card">
           <div id="tip-area">
             <button type="button" class="btn-tip" id="btn-add-tip" onclick="showTipForm()">+ Add Tip</button>
           </div>
         </div>

         <div class="card">
           <div class="payment-section">
             <div id="stripe-container" style="display:none">
               <div class="payment-label">Payment Details</div>
               <div id="stripe-element"></div>
               <div class="stripe-lock">🔒 Secured by Stripe</div>
             </div>
             <div id="err-msg" class="error-msg"></div>
             <button class="btn-pay" id="btn-pay" onclick="handlePay('${esc(token)}')">Pay Now</button>
           </div>
         </div>

         <div class="contact-note">
           Already paid? Contact us at
           <a href="mailto:reservations@amansala.com">reservations@amansala.com</a>
         </div>`
    }`;
}

// ─── PAYMENT ──────────────────────────────────────────────────
let _payInitiated = false;

async function handlePay(token) {
  const btn   = document.getElementById('btn-pay');
  const errEl = document.getElementById('err-msg');
  errEl.textContent = '';

  if (!_payInitiated) {
    // Step 1: Create PaymentIntent
    btn.disabled = true; btn.textContent = 'Loading…';
    try {
      const res  = await fetch('/.netlify/functions/folio-payment', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ token }),
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error ?? 'Error creating payment');

      _amountDue = data.amount;

      const dueEl = document.getElementById('due-amount');
      if (dueEl) dueEl.textContent = `$${Number(_amountDue).toFixed(2)}`;

      // Mount Stripe Payment Element
      _stripe      = Stripe(data.publishableKey);
      _stripeElems = _stripe.elements({
        clientSecret: data.clientSecret,
        appearance: {
          theme: 'stripe',
          variables: {
            fontFamily:    'Jost, sans-serif',
            borderRadius:  '8px',
            colorPrimary:  '#0d9488',
          },
        },
      });
      const payEl = _stripeElems.create('payment');

      const container = document.getElementById('stripe-container');
      if (container) container.style.display = 'block';
      payEl.mount('#stripe-element');

      btn.textContent = `Pay $${fmtUSD(_amountDue)}`;
      btn.disabled    = false;
      _payInitiated   = true;
      _folioIdForConfirm = data.folio.id;

    } catch (e) {
      errEl.textContent = e.message;
      btn.disabled  = false;
      btn.textContent = 'Pay Now';
    }
    return;
  }

  // Step 2: Confirm payment
  btn.disabled = true; btn.textContent = 'Processing…';
  try {
    const { error, paymentIntent } = await _stripe.confirmPayment({
      elements:      _stripeElems,
      confirmParams: { return_url: window.location.href + '&paid=1' },
      redirect:      'if_required',
    });
    if (error) {
      errEl.textContent = error.message;
      btn.disabled  = false;
      btn.textContent = `Pay $${fmtUSD(_amountDue)}`;
      return;
    }
    // Record the payment server-side (verified against Stripe) so the folio's
    // balance actually updates in the admin view -- a client-side "success" alone
    // never writes anything back to folio_items.
    if (paymentIntent?.id) {
      try {
        await fetch('/.netlify/functions/confirm-folio-payment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ paymentIntentId: paymentIntent.id, folioId: _folioIdForConfirm }),
        });
      } catch (e) { /* payment already succeeded with Stripe; surface success regardless */ }
    }
    showSuccess();
  } catch (e) {
    errEl.textContent = e.message;
    btn.disabled  = false;
    btn.textContent = `Pay $${fmtUSD(_amountDue)}`;
  }
}
let _amountDue = 0;
let _folioIdForConfirm = null;

// ─── ADD TIP ──────────────────────────────────────────────────
// Jorge's ask 2026-10-05: replace the free-text "what's this for" with a
// pick-list of departments (plus a "write a name" option for a specific
// person) so tips are easy to route, instead of relying on guests to type
// something staff can actually match to a department. Follow-up same day,
// twice: a guest may want to split one tip between several of them --
// first built as an even auto-split, then Jorge asked for a manual amount
// per recipient instead (no more auto-calculating) -- checking a recipient
// reveals its OWN amount field, and the overall total is just whatever
// those add up to, shown live, no separate "Tip Amount" entry at all.
const TIP_RECIPIENT_OPTIONS = [
  'General Staff', 'Kitchen', 'Housekeeping', 'Waiters', 'Beach & Yoga Cleaners', 'Front Desk', 'Bellboys',
];
function tipRecipientRowHtml(value, label, isCustom) {
  return `<div class="tip-recipient-row">
    <label>
      <input type="checkbox" class="tip-recipient-check" value="${escTip(value)}" data-custom="${isCustom ? '1' : ''}" onchange="tipRecipientToggle(this)">
      <span>${label}</span>
    </label>
    ${isCustom ? `<input type="text" class="tip-recipient-name" placeholder="Name" style="display:none" oninput="tipUpdateTotal()">` : ''}
    <input type="number" class="tip-recipient-amount" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" style="display:none" oninput="tipUpdateTotal()">
  </div>`;
}
function escTip(s) { return String(s).replace(/"/g, '&quot;'); }
function showTipForm() {
  const area = document.getElementById('tip-area');
  if (!area) return;
  area.innerHTML = `
    <div class="tip-form">
      <label>Would you like to leave this for general staff, or split it between specific people?</label>
      <div class="tip-recipients">
        ${TIP_RECIPIENT_OPTIONS.map(o => tipRecipientRowHtml(o, o, false)).join('')}
        ${tipRecipientRowHtml('__custom__', 'Someone specific', true)}
      </div>
      <div id="tip-total-hint" style="font-size:14px;font-weight:700;color:#0d9488;margin:12px 0">Total: $0.00</div>
      <div id="tip-err" class="error-msg" style="margin:0 0 10px"></div>
      <div class="tip-btn-row">
        <button type="button" class="btn-tip-cancel" onclick="hideTipForm()">Cancel</button>
        <button type="button" class="btn-pay" id="btn-tip-submit" onclick="submitTip()">Add Tip</button>
      </div>
    </div>`;
}

function tipRecipientToggle(checkbox) {
  const row = checkbox.closest('.tip-recipient-row');
  const amountEl = row.querySelector('.tip-recipient-amount');
  const nameEl = row.querySelector('.tip-recipient-name');
  amountEl.style.display = checkbox.checked ? 'block' : 'none';
  if (nameEl) nameEl.style.display = checkbox.checked ? 'block' : 'none';
  if (!checkbox.checked) { amountEl.value = ''; if (nameEl) nameEl.value = ''; }
  else (nameEl || amountEl).focus();
  tipUpdateTotal();
}

// Reads every checked recipient row's own typed amount -- no auto-split,
// just whatever the guest wrote for each one.
function tipCollectRecipients() {
  const out = [];
  document.querySelectorAll('.tip-recipient-row').forEach(row => {
    const check = row.querySelector('.tip-recipient-check');
    if (!check.checked) return;
    const isCustom = check.dataset.custom === '1';
    const name = isCustom ? row.querySelector('.tip-recipient-name').value.trim() : check.value;
    const amount = parseFloat(row.querySelector('.tip-recipient-amount').value);
    out.push({ name, amount, isCustom });
  });
  return out;
}

function tipUpdateTotal() {
  const hintEl = document.getElementById('tip-total-hint');
  if (!hintEl) return;
  const total = tipCollectRecipients().reduce((s, r) => s + (Number.isFinite(r.amount) ? r.amount : 0), 0);
  hintEl.textContent = `Total: $${total.toFixed(2)}`;
}

function hideTipForm() {
  const area = document.getElementById('tip-area');
  if (area) area.innerHTML = `<button type="button" class="btn-tip" id="btn-add-tip" onclick="showTipForm()">+ Add Tip</button>`;
}

async function submitTip() {
  const errEl = document.getElementById('tip-err');
  const btn   = document.getElementById('btn-tip-submit');
  const recipients = tipCollectRecipients();
  if (recipients.length === 0) { errEl.textContent = 'Choose at least one recipient.'; return; }
  for (const r of recipients) {
    if (r.isCustom && !r.name) { errEl.textContent = 'Please enter a name for "Someone specific".'; return; }
    if (!r.amount || r.amount <= 0) { errEl.textContent = `Enter a valid amount for ${r.name || 'the recipient'}.`; return; }
  }

  btn.disabled = true; btn.textContent = 'Adding…';
  try {
    let data;
    for (const r of recipients) {
      const res = await fetch('/.netlify/functions/add-folio-tip', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ token: _token, amount: r.amount, description: r.name }),
      });
      data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error ?? 'Could not add tip');
    }

    _items = data.items ?? _items;
    _total = data.total ?? _total;

    // The total just changed -- discard any in-progress Stripe payment so
    // "Pay Now" starts a fresh PaymentIntent for the updated amount.
    _payInitiated = false;
    _stripe       = null;
    _stripeElems  = null;
    _amountDue    = 0;

    renderFolio(_token);
  } catch (e) {
    errEl.textContent = e.message;
    btn.disabled = false; btn.textContent = 'Add Tip';
  }
}

function showSuccess() {
  const main = document.getElementById('main');
  const guestName = _booking
    ? `${esc(_booking.first_name ?? '')} ${esc(_booking.last_name ?? '')}`.trim()
    : 'Guest';
  main.innerHTML = `
    <div class="success-card">
      <div class="success-icon">✅</div>
      <h2>Payment confirmed!</h2>
      <p>
        Thank you, <strong>${guestName}</strong>.<br>
        Your payment of <strong>$${fmtUSD(_amountDue)}</strong> for <strong>${esc(_folio?.name ?? '')}</strong> was successful.<br><br>
        Questions? Email us at<br>
        <a href="mailto:reservations@amansala.com" style="color:#0d9488;font-weight:600">reservations@amansala.com</a>
      </p>
    </div>`;
}

// ─── HELPERS ──────────────────────────────────────────────────
function showError(msg) {
  document.getElementById('main').innerHTML = `
    <div class="state-error">
      <h3>Unable to load folio</h3>
      <p>${esc(msg)}</p>
      <p style="margin-top:14px;font-size:12px;color:#9ca3af">
        Please contact <a href="mailto:reservations@amansala.com" style="color:#0d9488">reservations@amansala.com</a>
      </p>
    </div>`;
}

function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s + 'T12:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function fmtUSD(n) {
  return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Handle redirect back after payment (Stripe redirect=if_required fallback)
(function checkRedirectResult() {
  const params = new URLSearchParams(location.search);
  if (params.get('paid') === '1' || params.get('payment_intent') || params.get('redirect_status') === 'succeeded') {
    // Wait for folio to load, then show success
    const waitAndShow = setInterval(() => {
      if (_folio) { clearInterval(waitAndShow); showSuccess(); }
    }, 200);
    setTimeout(() => clearInterval(waitAndShow), 5000);
  }
})();
</script>
</body>
</html>
