<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Cloudbeds Auth</title>
<style>body{font-family:sans-serif;max-width:600px;margin:60px auto;padding:0 20px;text-align:center}
code{background:#f1f5f9;padding:12px 20px;border-radius:8px;font-size:14px;word-break:break-all;display:block;margin:20px 0}
button{background:#0ea5e9;color:#fff;border:none;padding:12px 28px;border-radius:8px;font-size:16px;cursor:pointer}
</style></head>
<body>
<h2 id="title">Procesando...</h2>
<div id="content"></div>
<script>
const p = new URLSearchParams(location.search);
const code = p.get('code');
const err  = p.get('error');
if (err) {
  document.getElementById('title').textContent = 'Error de autorización';
  document.getElementById('content').innerHTML = '<p style="color:red">' + err + '</p>';
} else if (code) {
  document.getElementById('title').textContent = '✓ Código obtenido';
  document.getElementById('content').innerHTML =
    '<p>Copia este código y pásalo a Claude:</p>' +
    '<code id="c">' + code + '</code>' +
    '<button onclick="navigator.clipboard.writeText(document.getElementById(\'c\').textContent);this.textContent=\'¡Copiado!\'">Copiar</button>';
} else {
  document.getElementById('title').textContent = 'Sin código';
  document.getElementById('content').innerHTML = '<p>No se recibió ningún código de Cloudbeds.</p>';
}
</script>
</body>
</html>
