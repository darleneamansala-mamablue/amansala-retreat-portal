[build]
  publish = "."
  functions = "netlify/functions"

[functions."cloudbeds"]
  timeout = 26

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

# Short teacher-view links (one per event) now live in the _redirects file.

# Evening-before-checkout WhatsApp with the folio payment link (via Visito).
# 23:00 UTC = 6pm in Tulum. Dry run until CHECKOUT_LINKS_ENABLED=true.
[functions."send-checkout-payment-links"]
  schedule = "0 23 * * *"
