[build]
  publish = "."
  functions = "netlify/functions"

[functions."cloudbeds"]
  timeout = 26

# Retreat booking: the payment start re-checks the room in Cloudbeds and the fulfilment after payment updates Cloudbeds,
# both can take longer than the 10s default.
[functions."retreat-booking-intent"]
  timeout = 26

[functions."stripe-webhook"]
  timeout = 26

# Manual retry of a stuck retreat booking order (Dashboard "Action needed" row) -- re-runs the
# same fulfilment logic as stripe-webhook, including the Cloudbeds update, so needs the same room.
[functions."rb-retry-order"]
  timeout = 26

# Retreat booking: charges the remaining balances that are due (50% plan). 15:00 UTC = 10am in Tulum.
[functions."rb-charge-balances"]
  schedule = "0 15 * * *"
  timeout = 26

# Spa: copies the whole appointment list every 2 hours (keeps 7 days) and notes any appointment that disappeared since the last copy.
[functions."spa-appointments-backup"]
  schedule = "0 */2 * * *"
  timeout = 26

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

# Short teacher-view links (one per event) now live in the _redirects file.

# Evening-before-checkout WhatsApp with the folio payment link (via Visito).
# 22:00 UTC = 5pm in Tulum (Quintana Roo is UTC-5 fixed, no DST).
[functions."send-checkout-payment-links"]
  schedule = "0 22 * * *"

# Daily 7pm occupied-rooms report to maintenance/security (via Visito).
# 00:00 UTC = 7pm in Tulum (Quintana Roo is UTC-5 fixed, no DST).
[functions."send-climas-report"]
  schedule = "0 0 * * *"

# Late check-ins after the 7pm A/C list: every 30 min 7:30–11:30pm Tulum (00:30–04:30 UTC; the 00:00 run skips itself).
[functions."send-climas-late"]
  schedule = "*/30 0-4 * * *"

# Change history (sql/data_history.sql) keeps 120 days: older rows deleted nightly, 09:15 UTC = 4:15am Tulum.
[functions."data-history-cleanup"]
  schedule = "15 9 * * *"

# Portal -> Cloudbeds room sync (Jorge 2026-11-03: the portal is the truth): linked Cloudbeds reservations of the next
# 30 days that sit in another room are moved to the portal's room. 11:30 UTC = 6:30am Tulum, before the 7am room check.
[functions."cb-room-sync"]
  schedule = "30 11 * * *"
  timeout = 26

# Copies in Cloudbeds: the same guest with two active reservations for the same dates, next 30 days (by check-in, so
# the ones the window list leaves out are found too). Report only, in the 7am room check. 11:40 UTC = 6:40am Tulum.
[functions."cb-dup-scan"]
  schedule = "40 11 * * *"
  timeout = 26

# The portal's clear signal on a night someone asked for it (app_store 'clear_signal_scheduled' = {"date": <Tulum date>}):
# every open tab reloads its bookings and guests from the database. 03:00 UTC = 10pm Tulum.
[functions."portal-clear-signal"]
  schedule = "0 3 * * *"

# Daily room check (Jorge's ask 2026-11-03): guests outside their retreat's room list, the same guest twice, a room
# given to two bookings on the same nights -> one WhatsApp to app_store 'room_check_alert' numbers. 12:00 UTC = 7am Tulum.
[functions."room-list-check"]
  schedule = "0 12 * * *"

# Unscheduled test-trigger twin of send-climas-report -- scheduled functions 403 on a
# direct call, so this is the only way to fire a test send on demand.
[functions."send-climas-report-now"]

# Revenue Manager ("our Room Price Genie", Jorge's ask 2026-10-17): recomputes suggested
# Escape prices for the next 180 days, 3x/day per Jorge's ask 2026-10-17 -- 3am, 12pm, 8pm
# Tulum = 08:00, 17:00, 01:00 UTC (Quintana Roo is UTC-5 fixed, no DST). Suggestion-only --
# never writes be_rates itself, see netlify/functions/room-price-recalc.js.
[functions."room-price-recalc"]
  schedule = "0 1,8,17 * * *"
  timeout = 26

# Same recompute as above, callable on demand (Netlify returns 403 on direct requests to a
# scheduled function) -- this is what revenue-manager.html's "Refresh recommendations" calls.
[functions."room-price-recalc-now"]
  timeout = 26

# Texts therapists about last-minute spa bookings. Does nothing until app_store spa_text_alerts_config has enabled:true.
[functions."spa-text-alerts"]
  schedule = "*/5 * * * *"

# 8:00 PM Tulum (01:00 UTC): each therapist gets tomorrow's services (WhatsApp spa_resumen_terapeuta). Same on/off setting as spa-text-alerts.
[functions."spa-daily-summary"]
  schedule = "0 1 * * *"

# 9:00 PM Tulum (02:00 UTC): WhatsApp to Jorge with what Ask Jorge did, could not do, and what people asked (template amansala_ask_jorge_resumen).
[functions."ask-jorge-daily"]
  schedule = "0 2 * * *"

# Reading a staff schedule from a photo (Claude) takes 10-20 s: more than the 10 s default
[functions."staff-schedule-photo"]
  timeout = 26

# Ask Jorge help chat (Claude + read-only guest look-ups): a few model turns per question
[functions."ask-jorge"]
  timeout = 26

# Rooms reservations waiting for payment: the daily reminder until the 6-day due date (booking-payment-lib.js).
# 15:00 UTC = 10am Tulum.
[functions."booking-payment-reminders"]
  schedule = "0 15 * * *"
  timeout = 26
