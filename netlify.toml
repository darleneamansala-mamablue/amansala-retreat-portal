[build]
  publish = "."
  functions = "netlify/functions"

[functions."cloudbeds"]
  timeout = 26

# Retreat booking: the payment start re-checks the room in Cloudbeds and the fulfilment after payment updates Cloudbeds,
# both can take longer than the 10s default.
[functions."retreat-booking-intent"]
  timeout = 26

[functions."stripe-webhook"]
  timeout = 26

# Manual retry of a stuck retreat booking order (Dashboard "Action needed" row) -- re-runs the
# same fulfilment logic as stripe-webhook, including the Cloudbeds update, so needs the same room.
[functions."rb-retry-order"]
  timeout = 26

# Retreat booking: charges the remaining balances that are due (50% plan). 15:00 UTC = 10am in Tulum.
[functions."rb-charge-balances"]
  schedule = "0 15 * * *"
  timeout = 26

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

# Short teacher-view links (one per event) now live in the _redirects file.

# Evening-before-checkout WhatsApp with the folio payment link (via Visito).
# 22:00 UTC = 5pm in Tulum (Quintana Roo is UTC-5 fixed, no DST).
[functions."send-checkout-payment-links"]
  schedule = "0 22 * * *"

# Daily 7pm occupied-rooms report to maintenance/security (via Visito).
# 00:00 UTC = 7pm in Tulum (Quintana Roo is UTC-5 fixed, no DST).
[functions."send-climas-report"]
  schedule = "0 0 * * *"

# Unscheduled test-trigger twin of send-climas-report -- scheduled functions 403 on a
# direct call, so this is the only way to fire a test send on demand.
[functions."send-climas-report-now"]

# Revenue Manager ("our Room Price Genie", Jorge's ask 2026-10-17): recomputes suggested
# Escape prices for the next 180 days, 3x/day per Jorge's ask 2026-10-17 -- 3am, 12pm, 8pm
# Tulum = 08:00, 17:00, 01:00 UTC (Quintana Roo is UTC-5 fixed, no DST). Suggestion-only --
# never writes be_rates itself, see netlify/functions/room-price-recalc.js.
[functions."room-price-recalc"]
  schedule = "0 1,8,17 * * *"
  timeout = 26

# Same recompute as above, callable on demand (Netlify returns 403 on direct requests to a
# scheduled function) -- this is what revenue-manager.html's "Refresh recommendations" calls.
[functions."room-price-recalc-now"]
  timeout = 26
