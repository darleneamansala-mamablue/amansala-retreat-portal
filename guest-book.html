<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guest Book | Amansala</title>
<meta name="description" content="Helpful information for your stay at Amansala Eco-Chic Resort + Spa, Tulum, Mexico.">
<meta name="theme-color" content="#f8f5ee">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:#f8f5ee;
    --ink:#2b2420;
    --muted:#8a7f72;
    --gold:#c08a2e;
    --gold-soft:#f3e6cc;
    --line:#e8dfcd;
    --whatsapp:#25d366;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Jost',sans-serif;
    background:var(--sand);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding-bottom:48px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 20px}

  /* ── HEADER ───────────────────────────────────── */
  header{text-align:center;padding:28px 20px 18px}
  header img{height:46px;width:auto;margin:0 auto 6px}
  header .tag{
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--muted);font-weight:500;
  }

  /* ── HERO ─────────────────────────────────────── */
  .hero{
    position:relative;margin:4px 0 26px;border-radius:18px;overflow:hidden;
    height:min(46vw,260px);min-height:180px;
    box-shadow:0 8px 28px rgba(43,36,32,.14);
  }
  .hero img{width:100%;height:100%;object-fit:cover;display:block}
  .hero::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.08) 0%,rgba(0,0,0,.38) 100%);
  }
  .hero h1{
    position:absolute;left:0;right:0;bottom:20px;text-align:center;
    font-family:'Cormorant Garamond',serif;font-weight:600;
    font-size:clamp(24px,5.2vw,32px);color:#fff;z-index:1;
    text-shadow:0 2px 14px rgba(0,0,0,.35);letter-spacing:.3px;
  }

  h2.section-title{
    font-size:19px;font-weight:700;margin:6px 0 14px;color:var(--ink);
  }

  /* ── ACCORDION ────────────────────────────────── */
  .accordion{display:flex;flex-direction:column;gap:10px;margin-bottom:34px}
  .item{
    border:1.5px solid var(--line);border-radius:12px;background:#fff;
    overflow:hidden;transition:border-color .2s;
  }
  .item.open{border-color:var(--gold)}
  .item button.row{
    width:100%;display:flex;align-items:center;gap:12px;
    padding:15px 16px;background:none;border:none;cursor:pointer;
    font-family:'Jost',sans-serif;text-align:left;
  }
  .item .dot{
    flex-shrink:0;width:22px;height:22px;border-radius:50%;
    background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;
  }
  .item .dot svg{width:12px;height:12px}
  .item .label{flex:1;font-size:15px;font-weight:500;color:var(--gold)}
  .item .chev{
    flex-shrink:0;width:18px;height:18px;color:var(--gold);
    transition:transform .25s;
  }
  .item.open .chev{transform:rotate(90deg)}
  .item .panel{
    max-height:0;overflow:hidden;transition:max-height .28s ease;
  }
  .item.open .panel{max-height:4000px}
  .item .panel-inner{
    padding:0 18px 18px 50px;font-size:13.5px;line-height:1.75;color:#4b443c;
  }
  .item .panel-inner p+p{margin-top:10px}
  .item .panel-inner .placeholder{
    color:var(--muted);font-style:italic;font-size:13px;
  }
  .item .panel-inner ul{margin:6px 0 2px;padding-left:20px}
  .item .panel-inner li{margin-bottom:5px}
  .item .panel-inner h4{
    font-size:13px;font-weight:700;text-decoration:underline;
    text-underline-offset:3px;margin:16px 0 4px;color:var(--ink);
  }
  .item .panel-inner h4:first-child{margin-top:4px}
  .tour-photo{
    position:relative;margin:14px -18px 10px -50px;overflow:hidden;
    height:170px;
  }
  .tour-photo img{width:100%;height:100%;object-fit:cover;display:block}
  .tour-photo::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.45) 100%);
  }
  .tour-photo span{
    position:absolute;left:0;right:0;bottom:12px;text-align:center;
    font-weight:700;font-size:16px;color:#fff;z-index:1;
    text-shadow:0 1px 8px rgba(0,0,0,.4);
  }

  /* ── CONTACT US ───────────────────────────────── */
  .contact{
    border-top:2px solid var(--ink);padding-top:22px;margin-top:6px;
    text-align:center;
  }
  .contact h2{font-size:19px;font-weight:700;margin-bottom:6px}
  .contact p{font-size:13.5px;color:var(--muted);margin-bottom:18px}
  .wa-btn{
    display:inline-flex;align-items:center;gap:10px;
    background:var(--whatsapp);color:#fff;text-decoration:none;
    padding:14px 26px;border-radius:999px;font-size:15px;font-weight:600;
    box-shadow:0 6px 18px rgba(37,211,102,.35);
  }
  .wa-btn svg{width:20px;height:20px;flex-shrink:0}
  footer.pagefoot{
    text-align:center;padding:26px 20px 0;font-size:11px;color:var(--muted);
  }
</style>
</head>
<body>

function gbToggle(i){
  const item=document.getElementById('gb-item-'+i);
  const wasOpen=item.classList.contains('open');
  document.querySelectorAll('#gbAccordion .item.open').forEach(el=>el.classList.remove('open'));
  if(!wasOpen)item.classList.add('open');
}

function gbRender(){
  const el=document.getElementById('gbAccordion');
  el.innerHTML=GB_SECTIONS.map((s,i)=>`
    <div class="item" id="gb-item-${i}">
      <button class="row" onclick="gbToggle(${i})">
        <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
        <span class="label">${s.title}</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <div class="panel"><div class="panel-inner">${s.html}</div></div>
    </div>
  `).join('');
}
gbRender();

const waBtn=document.getElementById('gbWaBtn');
