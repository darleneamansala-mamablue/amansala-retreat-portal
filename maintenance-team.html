<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maintenance · Amansala</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:'Jost',sans-serif;background:#f5f1eb;color:#1f2937}
  header{background:#1a2332;color:#fff;padding:16px 18px}
  header h1{font-family:'Cormorant Garamond',serif;font-size:24px;margin:0}
  header p{margin:2px 0 0;font-size:13px;opacity:.8}
  main{padding:14px 14px 40px;max-width:640px;margin:0 auto}
  .tabs{display:flex;gap:6px;margin-bottom:12px}
  .tabs button{flex:1;padding:10px;border-radius:10px;border:1.5px solid #e5e7eb;background:#fff;font:600 14px Jost,sans-serif}
  .tabs button.on{background:#2d6a6a;color:#fff;border-color:#2d6a6a}
  .card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;border-left:6px solid #94a3b8}
  .card.urgent{border-left-color:#dc2626}
  .room{font-size:20px;font-weight:700}
  .tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:12px;margin-left:6px;vertical-align:middle}
  .prob{font-size:16px;margin:8px 0}
  .meta{font-size:12.5px;color:#6b7280}
  .btns{display:flex;gap:8px;margin-top:12px}
  .btns button{flex:1;padding:14px 8px;border-radius:12px;border:none;font:700 15px Jost,sans-serif}
  .go{background:#fef3c7;color:#92400e}.done{background:#16a34a;color:#fff}.note{background:#f1f5f9;color:#334155;flex:0 0 64px!important}
  .empty{text-align:center;color:#9ca3af;padding:40px 10px;background:#fff;border-radius:14px}
  .err{background:#fef2f2;color:#b91c1c;padding:16px;border-radius:12px}
</style>
</head>
<body>
<header><h1>Maintenance</h1><p id="who">Loading…</p></header>
<main>
  <div class="tabs"><button id="t-open" class="on" onclick="tab('open')">Pending</button><button id="t-done" onclick="tab('done')">Resolved (3 days)</button></div>
  <div id="list"></div>
</main>
<script>
// The maintenance team's page (Jorge 2026-11-06): each person opens it from the link in their WhatsApp; they mark a report
// "On my way" (In progress) and "Resolved" -- at Resolved the guest gets the confirmation right away. netlify/functions/maintenance-team.js
const K = new URLSearchParams(location.search).get('k') || '';
const CAT = { ac: '❄️ Air Conditioning', door: '🚪 Door / Lock', safe: '🔒 Safe', electricity: '💡 Electricity', water: '🚿 Water / Plumbing', other: '🔧 Other' };
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const when = t => { try { return new Date(t).toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit' }); } catch (e) { return ''; } };
let data = { tickets: [] }, view = 'open';
async function load() {
  try {
    const r = await fetch('/.netlify/functions/maintenance-team?k=' + encodeURIComponent(K));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Error');
    data = d; document.getElementById('who').textContent = 'Hi ' + d.me + ' — reports from guests and staff';
    render();
  } catch (e) { document.getElementById('who').textContent = ''; document.getElementById('list').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
function tab(v) { view = v; document.getElementById('t-open').classList.toggle('on', v === 'open'); document.getElementById('t-done').classList.toggle('on', v === 'done'); render(); }
function render() {
  const list = data.tickets.filter(t => view === 'open' ? t.status !== 'resolved' : t.status === 'resolved')
    .sort((a, b) => view === 'open' ? ((a.priority === 'urgent' ? 0 : 1) - (b.priority === 'urgent' ? 0 : 1)) || String(a.createdAt).localeCompare(String(b.createdAt)) : String(b.resolvedAt).localeCompare(String(a.resolvedAt)));
  const box = document.getElementById('list');
  if (!list.length) { box.innerHTML = `<div class="empty">${view === 'open' ? 'Nothing pending 🎉' : 'Nothing resolved in the last 3 days.'}</div>`; return; }
  box.innerHTML = list.map(t => `<div class="card ${t.priority === 'urgent' ? 'urgent' : ''}">
    <div><span class="room">Room ${esc(t.room)}</span>${t.priority === 'urgent' ? '<span class="tag" style="background:#dc2626;color:#fff">URGENT</span>' : ''}<span class="tag" style="background:#f1f5f9;color:#334155">${CAT[t.category] || CAT.other}</span>${t.status === 'in_progress' ? '<span class="tag" style="background:#fef3c7;color:#92400e">On the way</span>' : ''}</div>
    <div class="prob">${esc(t.problem)}</div>
    <div class="meta">${esc(t.id)} · ${when(t.createdAt)}${t.guestName ? ' · ' + esc(t.guestName) : ''}${t.assignedTo ? ' · 👤 ' + esc(t.assignedTo) : ''}${t.resolvedAt ? ' · ✓ ' + when(t.resolvedAt) + ' by ' + esc(t.resolvedBy) : ''}</div>
    ${(t.notes || []).filter(n => !/^Status:|^Assigned|^Category/.test(n.text)).map(n => `<div class="meta">📝 ${esc(n.by)}: ${esc(n.text)}</div>`).join('')}
    ${t.status !== 'resolved' ? `<div class="btns">${t.status === 'open' ? `<button class="go" onclick="act('${t.id}','in_progress')">🔧 On my way</button>` : ''}<button class="done" onclick="act('${t.id}','resolved')">✓ Resolved</button><button class="note" onclick="note('${t.id}')">📝</button></div>` : ''}
  </div>`).join('');
}
async function post(body) {
  const r = await fetch('/.netlify/functions/maintenance-team', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ k: K, ...body }) });
  const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || 'Not saved'); return d;
}
async function act(id, status) {
  const t = data.tickets.find(x => x.id === id);
  if (status === 'resolved' && !confirm(`Room ${t.room}: is it fixed? The guest gets a message now.`)) return;
  try { await post({ id, status }); await load(); } catch (e) { alert(e.message); }
}
async function note(id) { const v = prompt('Note (what you did, parts needed…):'); if (!v || !v.trim()) return; try { await post({ id, note: v }); await load(); } catch (e) { alert(e.message); } }
load(); setInterval(load, 60000);
</script>
</body>
</html>
