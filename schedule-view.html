<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retreat Schedule | Amansala Tulum</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --teal:#2d6a6a; --dark:#1a2332; --border:#e0d8cc; --muted:#6b7280; }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Jost',sans-serif;color:var(--dark);background:#f8f5f0;padding:24px;min-height:100vh}
  .wrap{max-width:760px;margin:0 auto;background:#fff;border:1px solid var(--border);border-radius:14px;padding:32px 36px}
  .brand{font-size:13px;font-weight:700;letter-spacing:.24em;color:var(--teal);text-align:center;margin-bottom:22px}
  h1{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;margin-bottom:4px}
  .sub{font-size:13px;color:var(--muted);margin-bottom:24px}
  .day-block{margin-bottom:22px;break-inside:avoid}
  .day-lbl{font-size:15px;font-weight:700;color:var(--dark);margin-bottom:6px;font-family:'Cormorant Garamond',serif}
  .day-line{height:1px;background:var(--border);margin-bottom:8px}
  .row{display:flex;align-items:baseline;padding:5px 0;border-bottom:1px solid #f2ede8;gap:14px}
  .row .time{min-width:120px;flex-shrink:0;font-size:12.5px;color:var(--muted);font-weight:600}
  .row .desc{flex:1;font-size:13.5px}
  .row .shala{font-size:11px;font-weight:700;color:#0e7490;white-space:nowrap}
  .state{text-align:center;padding:40px 0;font-size:14px;color:var(--muted)}
  @media (max-width:600px){.wrap{padding:22px 18px}.row{flex-wrap:wrap;gap:2px}.row .time{min-width:0}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">AMANSALA</div>
    <div id="content"><div class="state">Loading schedule…</div></div>
  </div>

<script>
const token = new URLSearchParams(location.search).get('token');

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(s){ if(!s) return ''; const [y,m,d]=s.split('-'); return `${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]} ${+d}, ${y}`; }

// Read-only — this page never writes anything back and has no edit
// affordances. Looked up by a long random token, never by the booking's
// internal id (get-schedule-by-token.js resolves it server-side with the
// service key and returns only the fields rendered below). Always re-fetches
// on load, so it reflects any later change to the schedule automatically —
// unlike the downloaded/emailed PDF, which is a fixed snapshot.
async function init(){
  const content=document.getElementById('content');
  if(!token){content.innerHTML='<div class="state">Missing schedule link. Please use the link that was shared with you.</div>';return;}

  let data;
  try{
    const res=await fetch('/.netlify/functions/get-schedule-by-token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});
    data=await res.json();
    if(!res.ok||data.error){content.innerHTML='<div class="state">We couldn\'t find this schedule. Please contact Amansala.</div>';return;}
  }catch(e){
    content.innerHTML='<div class="state">We couldn\'t find this schedule. Please contact Amansala.</div>';return;
  }

  const days=data.days||[];
  content.innerHTML=`
    <h1>${esc(data.retreatName||data.leaderName||'Your Retreat')}</h1>
    <div class="sub">${fmtDate(data.startDate)} – ${fmtDate(data.endDate)}</div>
    ${days.map(day=>`
      <div class="day-block">
        <div class="day-lbl">${esc(day.label)}</div>
        <div class="day-line"></div>
        ${(day.rows||[]).map(r=>`
          <div class="row">
            <span class="time">${esc(r.time||'')}</span>
            <span class="desc">${esc(r.desc||'')}</span>
            ${r.shala?`<span class="shala">📍 ${esc(r.shala.toUpperCase())}</span>`:''}
          </div>`).join('')}
      </div>`).join('')}
  `;
}
init();
</script>
</body>
</html>
